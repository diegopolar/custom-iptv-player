name: custom_iptv_player
description: Reproductor IPTV M3U / HLS para móvil y Android TV.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  video_player: ^2.8.6
  chewie: ^1.8.1
  http: ^1.2.1
  shared_preferences: ^2.2.3
  file_picker: ^8.0.3
  path_provider: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
