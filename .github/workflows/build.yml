name: Build Polar TV APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Instalar ImageMagick para procesar el logo
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Configurar Polar TV, PiP, Listas y Logo de Panda
        run: |
          # 1. Respaldar Manifest original
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml.bak
          
          # 2. Generar estructura Android base
          flutter create --platforms=android --project-name polartv --org com.polar .
          
          # 3. Restaurar Manifest original
          cp /tmp/AndroidManifest.xml.bak android/app/src/main/AndroidManifest.xml
          
          # 4. Inyectar nombre "Polar TV", orientación libre y soporte PiP (Ventana Flotante)
          sed -i 's/android:label="[^"]*"/android:label="Polar TV"/g' android/app/src/main/AndroidManifest.xml
          sed -i 's/android:screenOrientation="landscape"/android:screenOrientation="unspecified"/g' android/app/src/main/AndroidManifest.xml
          
          if ! grep -q "supportsPictureInPicture" android/app/src/main/AndroidManifest.xml; then
            sed -i 's/<activity/<activity android:supportsPictureInPicture="true" android:configChanges="screenSize|smallestScreenSize|screenLayout|orientation"/g' android/app/src/main/AndroidManifest.xml
          fi
          
          # 5. Cambiar título interno en main.dart
          if [ -f lib/main.dart ]; then
            sed -i "s/title: '[^']*'/title: 'Polar TV'/g" lib/main.dart
            sed -i 's/title: "[^"]*"/title: "Polar TV"/g' lib/main.dart
          fi

          # 6. Permitir orientación vertical en player_screen.dart
          if [ -f lib/screens/player_screen.dart ]; then
            sed -i 's/DeviceOrientation.landscapeLeft,/DeviceOrientation.portraitUp, DeviceOrientation.landscapeLeft,/g' lib/screens/player_screen.dart
          fi

          # 7. Precargar listas (Perú y Global) en playlist_storage.dart
          python3 -c '
          import os

          storage_path = "lib/services/playlist_storage.dart"
          if os.path.exists(storage_path):
              with open(storage_path, "r") as f:
                  content = f.read()
              
              replacement = """
                if (list.isEmpty) {
                  return [
                    Playlist(id: "pe", name: "Canales Perú", url: "https://iptv-org.github.io/iptv/countries/pe.m3u", isLocal: false, addedAt: DateTime.now()),
                    Playlist(id: "global", name: "Canales Globales", url: "https://iptv-org.github.io/iptv/index.m3u", isLocal: false, addedAt: DateTime.now())
                  ];
                }
              """
              if "return list;" in content:
                  content = content.replace("return list;", replacement + "\n    return list;")
              elif "return playlists;" in content:
                  content = content.replace("return playlists;", replacement.replace("list", "playlists") + "\n    return playlists;")
              
              with open(storage_path, "w") as f:
                  f.write(content)
          '

          # 8. Crear diseño vectorial del Oso Panda
          cat << 'EOF' > /tmp/panda.svg
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
            <rect width="512" height="512" rx="110" fill="#111827"/>
            <!-- Orejas -->
            <circle cx="140" cy="140" r="56" fill="#1F2937" stroke="#06B6D4" stroke-width="8"/>
            <circle cx="372" cy="140" r="56" fill="#1F2937" stroke="#06B6D4" stroke-width="8"/>
            <!-- Cabeza -->
            <ellipse cx="256" cy="275" rx="160" ry="140" fill="#F9FAFB"/>
            <!-- Manchas Ojos -->
            <ellipse cx="190" cy="255" rx="42" ry="50" fill="#1F2937" transform="rotate(-15 190 255)"/>
            <ellipse cx="322" cy="255" rx="42" ry="50" fill="#1F2937" transform="rotate(15 322 255)"/>
            <!-- Pupilas Celestes -->
            <circle cx="196" cy="248" r="14" fill="#06B6D4"/>
            <circle cx="200" cy="244" r="5" fill="#FFFFFF"/>
            <circle cx="316" cy="248" r="14" fill="#06B6D4"/>
            <circle cx="312" cy="244" r="5" fill="#FFFFFF"/>
            <!-- Nariz y Hocico -->
            <ellipse cx="256" cy="315" rx="24" ry="16" fill="#1F2937"/>
            <path d="M 238 338 Q 256 352 274 338" stroke="#1F2937" stroke-width="7" stroke-linecap="round" fill="none"/>
            <!-- Texto Polar TV -->
            <text x="256" y="465" font-family="Arial, sans-serif" font-weight="900" font-size="42" fill="#06B6D4" text-anchor="middle" letter-spacing="3">POLAR TV</text>
          </svg>
          EOF

          # Generar los iconos de Android directamente en todas las densidades de pantalla
          RES="android/app/src/main/res"
          convert -background none /tmp/panda.svg -resize 48x48   $RES/mipmap-mdpi/ic_launcher.png
          convert -background none /tmp/panda.svg -resize 72x72   $RES/mipmap-hdpi/ic_launcher.png
          convert -background none /tmp/panda.svg -resize 96x96   $RES/mipmap-xhdpi/ic_launcher.png
          convert -background none /tmp/panda.svg -resize 144x144 $RES/mipmap-xxhdpi/ic_launcher.png
          convert -background none /tmp/panda.svg -resize 192x192 $RES/mipmap-xxxhdpi/ic_launcher.png

          # 9. Forzar compileSdk 36 en todos los subproyectos
          cat << 'EOF' >> android/build.gradle

          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          compileSdkVersion 36
                      }
                  }
              }
          }
          EOF

          # 10. Obtener paquetes limpios
          flutter pub get

      - name: Compilar APK con Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Localizar APK generado
        run: |
          mkdir -p apk_output
          find . -name "*.apk" -type f -exec cp {} apk_output/PolarTV-release.apk \;
          ls -la apk_output/

      - name: Subir APK de Polar TV
        uses: actions/upload-artifact@v4
        with:
          name: Polar-TV-APK
          path: apk
