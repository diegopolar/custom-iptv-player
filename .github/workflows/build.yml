name: Build Polar TV APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Instalar ImageMagick y configurar permisos
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          mkdir -p /home/runner/.android /home/runner/.config/.android
          sudo chown -R $USER:$USER /home/runner
          
          keytool -genkey -v -keystore /home/runner/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true
          cp /home/runner/.android/debug.keystore /home/runner/.config/.android/debug.keystore || true

      - name: Configurar Polar TV Smart TV (Leanback, D-Pad Foco y Banner)
        run: |
          # 1. Regenerar estructura Android limpia
          flutter create --platforms=android --project-name polartv --org com.polar .

          # 2. Configurar AndroidManifest con soporte Móvil + Android TV (Leanback)
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>

              <!-- Soporte para Smart TV sin pantalla táctil requerida -->
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
              <uses-feature android:name="android.software.leanback" android:required="false" />

              <application
                  android:label="Polar TV"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:banner="@drawable/tv_banner"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:taskAffinity=""
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:supportsPictureInPicture="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme"
                        />
                      <!-- Launcher para Celulares y Tablets -->
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                      <!-- Launcher oficial para Android TV y Google TV -->
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF

          # 3. MainActivity.kt con pantalla encendida y PiP
          mkdir -p android/app/src/main/kotlin/com/polar/polartv
          cat << 'EOF' > android/app/src/main/kotlin/com/polar/polartv/MainActivity.kt
          package com.polar.polartv

          import android.app.PictureInPictureParams
          import android.os.Build
          import android.os.Bundle
          import android.util.Rational
          import android.view.WindowManager
          import io.flutter.embedding.android.FlutterActivity

          class MainActivity: FlutterActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
              }

              override fun onUserLeaveHint() {
                  super.onUserLeaveHint()
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      try {
                          val params = PictureInPictureParams.Builder()
                              .setAspectRatio(Rational(16, 9))
                              .build()
                          enterPictureInPictureMode(params)
                      } catch (e: Exception) {
                          enterPictureInPictureMode()
                      }
                  }
              }
          }
          EOF

          # 4. Tema Ártico en main.dart
          cat << 'EOF' > lib/main.dart
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'screens/home_screen.dart';

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            SystemChrome.setSystemUIOverlayStyle(
              const SystemUiOverlayStyle(
                statusBarColor: Colors.transparent,
                statusBarIconBrightness: Brightness.light,
              ),
            );
            runApp(const PolarTvApp());
          }

          class PolarTvApp extends StatelessWidget {
            const PolarTvApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'Polar TV',
                debugShowCheckedModeBanner: false,
                theme: ThemeData.dark().copyWith(
                  scaffoldBackgroundColor: const Color(0xFF0B132B),
                  primaryColor: const Color(0xFF00E5FF),
                  colorScheme: const ColorScheme.dark(
                    primary: Color(0xFF00E5FF),
                    secondary: Color(0xFF48CAE4),
                    surface: Color(0xFF1C2541),
                  ),
                  appBarTheme: const AppBarTheme(
                    backgroundColor: Color(0xFF0B132B),
                    elevation: 0,
                    centerTitle: true,
                    titleTextStyle: TextStyle(
                      fontSize: 22,
                      fontWeight: FontWeight.bold,
                      letterSpacing: 1.5,
                      color: Color(0xFF00E5FF),
                    ),
                  ),
                ),
                home: const HomeScreen(),
              );
            }
          }
          EOF

          # 5. HomeScreen con navegación por Control Remoto (Focusable)
          cat << 'EOF' > lib/screens/home_screen.dart
          import 'package:flutter/material.dart';
          import '../models/channel.dart';
          import '../services/playlist_storage.dart';
          import 'channels_screen.dart';

          class HomeScreen extends StatefulWidget {
            const HomeScreen({super.key});

            @override
            State<HomeScreen> createState() => _HomeScreenState();
          }

          class _HomeScreenState extends State<HomeScreen> {
            final PlaylistStorage _store = PlaylistStorage();
            final TextEditingController _urlCtrl = TextEditingController();
            final TextEditingController _nameCtrl = TextEditingController();
            List<Playlist> _playlists = [];
            bool _loading = true;

            static final List<Playlist> _defaults = [
              const Playlist(
                id: 'pe',
                name: 'Canales Perú 🇵🇪',
                source: 'https://iptv-org.github.io/iptv/countries/pe.m3u',
                isLocal: false,
              ),
              const Playlist(
                id: 'global',
                name: 'Canales Globales 🌐',
                source: 'https://iptv-org.github.io/iptv/index.m3u',
                isLocal: false,
              ),
            ];

            @override
            void initState() {
              super.initState();
              _load();
            }

            Future<void> _load() async {
              setState(() => _loading = true);
              final saved = await _store.getAll();
              if (saved.isEmpty) {
                for (final p in _defaults) {
                  await _store.add(p);
                }
                _playlists = List.from(_defaults);
              } else {
                _playlists = saved;
              }
              if (mounted) setState(() => _loading = false);
            }

            void _showAddDialog() {
              _urlCtrl.clear();
              _nameCtrl.clear();
              showModalBottomSheet(
                context: context,
                isScrollControlled: true,
                backgroundColor: const Color(0xFF1C2541),
                shape: const RoundedRectangleBorder(
                  borderRadius: BorderRadius.vertical(top: Radius.circular(24)),
                ),
                builder: (ctx) => Padding(
                  padding: EdgeInsets.only(
                    left: 20,
                    right: 20,
                    top: 24,
                    bottom: MediaQuery.of(ctx).viewInsets.bottom + 24,
                  ),
                  child: Column(
                    mainAxisSize: MainAxisSize.min,
                    crossAxisAlignment: CrossAxisAlignment.stretch,
                    children: [
                      const Text(
                        'Añadir Lista M3U',
                        style: TextStyle(fontSize: 20, fontWeight: FontWeight.bold, color: Color(0xFF00E5FF)),
                      ),
                      const SizedBox(height: 16),
                      TextField(
                        controller: _nameCtrl,
                        decoration: InputDecoration(
                          labelText: 'Nombre de la lista (ej: Deportes)',
                          filled: true,
                          fillColor: const Color(0xFF0B132B),
                          border: OutlineInputBorder(borderRadius: BorderRadius.circular(12)),
                        ),
                      ),
                      const SizedBox(height: 12),
                      TextField(
                        controller: _urlCtrl,
                        decoration: InputDecoration(
                          labelText: 'URL de la lista .m3u o .m3u8',
                          filled: true,
                          fillColor: const Color(0xFF0B132B),
                          border: OutlineInputBorder(borderRadius: BorderRadius.circular(12)),
                        ),
                      ),
                      const SizedBox(height: 20),
                      ElevatedButton(
                        style: ElevatedButton.styleFrom(
                          backgroundColor: const Color(0xFF00E5FF),
                          foregroundColor: const Color(0xFF0B132B),
                          padding: const EdgeInsets.symmetric(vertical: 14),
                          shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(12)),
                        ),
                        onPressed: () async {
                          final url = _urlCtrl.text.trim();
                          final name = _nameCtrl.text.trim();
                          if (url.isNotEmpty) {
                            final pl = Playlist(
                              id: DateTime.now().millisecondsSinceEpoch.toString(),
                              name: name.isEmpty ? 'Mi Lista' : name,
                              source: url,
                              isLocal: false,
                            );
                            await _store.add(pl);
                            Navigator.pop(ctx);
                            _load();
                          }
                        },
                        child: const Text('Guardar y Cargar', style: TextStyle(fontWeight: FontWeight.bold, fontSize: 16)),
                      )
                    ],
                  ),
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: Row(
                    mainAxisSize: MainAxisSize.min,
                    children: [
                      Container(
                        padding: const EdgeInsets.all(6),
                        decoration: BoxDecoration(
                          color: const Color(0xFF00E5FF).withOpacity(0.15),
                          shape: BoxShape.circle,
                        ),
                        child: const Icon(Icons.tv, color: Color(0xFF00E5FF), size: 22),
                      ),
                      const SizedBox(width: 10),
                      const Text('POLAR TV'),
                    ],
                  ),
                  actions: [
                    IconButton(
                      icon: const Icon(Icons.add_circle_outline, color: Color(0xFF00E5FF), size: 28),
                      tooltip: 'Añadir Lista',
                      onPressed: _showAddDialog,
                    ),
                  ],
                ),
                body: _loading
                    ? const Center(child: CircularProgressIndicator(color: Color(0xFF00E5FF)))
                    : ListView(
                        padding: const EdgeInsets.all(24),
                        children: [
                          const Text(
                            'Mis Listas de Transmisión (Usa las flechas del control)',
                            style: TextStyle(fontSize: 16, fontWeight: FontWeight.w600, color: Colors.white70),
                          ),
                          const SizedBox(height: 16),
                          ..._playlists.map((pl) => _TvFocusableCard(
                                onTap: () {
                                  Navigator.push(
                                    context,
                                    MaterialPageRoute(builder: (_) => ChannelsScreen(playlist: pl)),
                                  );
                                },
                                child: ListTile(
                                  contentPadding: const EdgeInsets.symmetric(horizontal: 20, vertical: 12),
                                  leading: CircleAvatar(
                                    backgroundColor: const Color(0xFF00E5FF).withOpacity(0.15),
                                    radius: 26,
                                    child: Icon(
                                      pl.name.contains('Perú') ? Icons.flag : Icons.public,
                                      color: const Color(0xFF00E5FF),
                                      size: 28,
                                    ),
                                  ),
                                  title: Text(
                                    pl.name,
                                    style: const TextStyle(fontSize: 18, fontWeight: FontWeight.bold, color: Colors.white),
                                  ),
                                  subtitle: Text(
                                    pl.source,
                                    maxLines: 1,
                                    overflow: TextOverflow.ellipsis,
                                    style: TextStyle(fontSize: 13, color: Colors.white.withOpacity(0.6)),
                                  ),
                                  trailing: const Icon(Icons.arrow_forward_ios, color: Color(0xFF00E5FF), size: 20),
                                ),
                              )),
                        ],
                      ),
              );
            }
          }

          class _TvFocusableCard extends StatefulWidget {
            final Widget child;
            final VoidCallback onTap;
            const _TvFocusableCard({required this.child, required this.onTap});

            @override
            State<_TvFocusableCard> createState() => _TvFocusableCardState();
          }

          class _TvFocusableCardState extends State<_TvFocusableCard> {
            bool _focused = false;

            @override
            Widget build(BuildContext context) {
              return Focus(
                onFocusChange: (has) => setState(() => _focused = has),
                child: AnimatedContainer(
                  duration: const Duration(milliseconds: 180),
                  margin: const EdgeInsets.only(bottom: 16),
                  transform: _focused ? (Matrix4.identity()..scale(1.02)) : Matrix4.identity(),
                  decoration: BoxDecoration(
                    gradient: LinearGradient(
                      colors: _focused
                          ? [const Color(0xFF243356), const Color(0xFF1F2C4C)]
                          : [const Color(0xFF1C2541), const Color(0xFF16203B)],
                      begin: Alignment.topLeft,
                      end: Alignment.bottomRight,
                    ),
                    borderRadius: BorderRadius.circular(16),
                    border: Border.all(
                      color: _focused ? const Color(0xFF00E5FF) : Colors.white.withOpacity(0.08),
                      width: _focused ? 2.5 : 1.0,
                    ),
                    boxShadow: [
                      BoxShadow(
                        color: _focused ? const Color(0xFF00E5FF).withOpacity(0.35) : Colors.black.withOpacity(0.3),
                        blurRadius: _focused ? 18 : 10,
                        offset: const Offset(0, 4),
                      ),
                    ],
                  ),
                  child: InkWell(
                    borderRadius: BorderRadius.circular(16),
                    onTap: widget.onTap,
                    child: widget.child,
                  ),
                ),
              );
            }
          }
          EOF

          # 6. ChannelsScreen con soporte de foco de control remoto en cada canal
          cat << 'EOF' > lib/screens/channels_screen.dart
          import 'package:flutter/material.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import '../models/channel.dart';
          import '../services/playlist_storage.dart';
          import 'player_screen.dart';

          class ChannelsScreen extends StatefulWidget {
            final Playlist playlist;
            const ChannelsScreen({super.key, required this.playlist});

            @override
            State<ChannelsScreen> createState() => _ChannelsScreenState();
          }

          class _ChannelsScreenState extends State<ChannelsScreen> {
            List<Channel> _all = [];
            List<Channel> _filtered = [];
            Set<String> _favUrls = {};
            String _selectedCategory = 'Todos';
            String _query = '';
            bool _loading = true;
            bool _onlyFavs = false;

            @override
            void initState() {
              super.initState();
              _init();
            }

            Future<void> _init() async {
              final prefs = await SharedPreferences.getInstance();
              final favs = prefs.getStringList('polar_favs') ?? [];
              _favUrls = favs.toSet();

              try {
                final channels = await PlaylistStorage().loadChannels(widget.playlist);
                _all = channels;
                _applyFilter();
              } catch (_) {}

              if (mounted) setState(() => _loading = false);
            }

            Future<void> _toggleFav(Channel c) async {
              setState(() {
                if (_favUrls.contains(c.url)) {
                  _favUrls.remove(c.url);
                } else {
                  _favUrls.add(c.url);
                }
              });
              final prefs = await SharedPreferences.getInstance();
              await prefs.setStringList('polar_favs', _favUrls.toList());
              _applyFilter();
            }

            void _applyFilter() {
              setState(() {
                _filtered = _all.where((c) {
                  final matchesQuery = c.name.toLowerCase().contains(_query.toLowerCase());
                  final matchesCat = _selectedCategory == 'Todos' || c.group == _selectedCategory;
                  final matchesFav = !_onlyFavs || _favUrls.contains(c.url);
                  return matchesQuery && matchesCat && matchesFav;
                }).toList();
              });
            }

            List<String> get _categories {
              final set = <String>{'Todos'};
              for (final c in _all) {
                if (c.group.isNotEmpty) set.add(c.group);
              }
              return set.toList();
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: Text(widget.playlist.name),
                  actions: [
                    IconButton(
                      icon: Icon(
                        _onlyFavs ? Icons.star : Icons.star_border,
                        color: _onlyFavs ? Colors.amberAccent : Colors.white70,
                        size: 28,
                      ),
                      tooltip: 'Ver Favoritos',
                      onPressed: () {
                        setState(() => _onlyFavs = !_onlyFavs);
                        _applyFilter();
                      },
                    ),
                  ],
                ),
                body: _loading
                    ? const Center(
                        child: Column(
                          mainAxisAlignment: MainAxisAlignment.center,
                          children: [
                            CircularProgressIndicator(color: Color(0xFF00E5FF)),
                            SizedBox(height: 16),
                            Text('Cargando señales de Polar TV...', style: TextStyle(color: Colors.white70)),
                          ],
                        ),
                      )
                    : Column(
                        children: [
                          // Buscador
                          Padding(
                            padding: const EdgeInsets.symmetric(horizontal: 20, vertical: 8),
                            child: TextField(
                              style: const TextStyle(color: Colors.white),
                              decoration: InputDecoration(
                                hintText: 'Buscar canal...',
                                hintStyle: const TextStyle(color: Colors.white38),
                                prefixIcon: const Icon(Icons.search, color: Color(0xFF00E5FF)),
                                filled: true,
                                fillColor: const Color(0xFF1C2541),
                                contentPadding: const EdgeInsets.symmetric(vertical: 0),
                                border: OutlineInputBorder(
                                  borderRadius: BorderRadius.circular(14),
                                  borderSide: BorderSide.none,
                                ),
                              ),
                              onChanged: (v) {
                                _query = v;
                                _applyFilter();
                              },
                            ),
                          ),
                          // Chips de categorías
                          if (!_onlyFavs && _categories.length > 1)
                            SizedBox(
                              height: 48,
                              child: ListView.builder(
                                scrollDirection: Axis.horizontal,
                                padding: const EdgeInsets.symmetric(horizontal: 16),
                                itemCount: _categories.length,
                                itemBuilder: (ctx, i) {
                                  final cat = _categories[i];
                                  final isSel = cat == _selectedCategory;
                                  return Padding(
                                    padding: const EdgeInsets.symmetric(horizontal: 4),
                                    child: ChoiceChip(
                                      label: Text(cat),
                                      selected: isSel,
                                      selectedColor: const Color(0xFF00E5FF),
                                      backgroundColor: const Color(0xFF1C2541),
                                      labelStyle: TextStyle(
                                        color: isSel ? const Color(0xFF0B132B) : Colors.white70,
                                        fontWeight: isSel ? FontWeight.bold : FontWeight.normal,
                                      ),
                                      onSelected: (val) {
                                        if (val) {
                                          setState(() => _selectedCategory = cat);
                                          _applyFilter();
                                        }
                                      },
                                    ),
                                  );
                                },
                              ),
                            ),
                          const SizedBox(height: 8),
                          // Cuadrícula con soporte para control remoto (D-Pad)
                          Expanded(
                            child: _filtered.isEmpty
                                ? Center(
                                    child: Text(
                                      _onlyFavs ? 'No tienes canales favoritos aún' : 'No se encontraron canales',
                                      style: const TextStyle(color: Colors.white54, fontSize: 16),
                                    ),
                                  )
                                : LayoutBuilder(
                                    builder: (context, constraints) {
                                      // Ajustar columnas dinámicamente si es pantalla ancha de TV
                                      final isTv = constraints.maxWidth > 800;
                                      final crossCount = isTv ? 4 : 2;

                                      return GridView.builder(
                                        padding: const EdgeInsets.all(16),
                                        gridDelegate: SliverGridDelegateWithFixedCrossAxisCount(
                                          crossAxisCount: crossCount,
                                          childAspectRatio: 1.4,
                                          crossAxisSpacing: 16,
                                          mainAxisSpacing: 16,
                                        ),
                                        itemCount: _filtered.length,
                                        itemBuilder: (ctx, i) {
                                          final c = _filtered[i];
                                          final isFav = _favUrls.contains(c.url);
                                          return _TvChannelTile(
                                            channel: c,
                                            isFav: isFav,
                                            onToggleFav: () => _toggleFav(c),
                                            onTap: () {
                                              Navigator.push(
                                                context,
                                                MaterialPageRoute(
                                                  builder: (_) => PlayerScreen(
                                                    channels: _filtered,
                                                    index: i,
                                                  ),
                                                ),
                                              );
                                            },
                                          );
                                        },
                                      );
                                    },
                                  ),
                          ),
                        ],
                      ),
              );
            }
          }

          class _TvChannelTile extends StatefulWidget {
            final Channel channel;
            final bool isFav;
            final VoidCallback onToggleFav;
            final VoidCallback onTap;

            const _TvChannelTile({
              required this.channel,
              required this.isFav,
              required this.onToggleFav,
              required this.onTap,
            });

            @override
            State<_TvChannelTile> createState() => _TvChannelTileState();
          }

          class _TvChannelTileState extends State<_TvChannelTile> {
            bool _focused = false;

            @override
            Widget build(BuildContext context) {
              return Focus(
                onFocusChange: (has) => setState(() => _focused = has),
                child: AnimatedContainer(
                  duration: const Duration(milliseconds: 180),
                  transform: _focused ? (Matrix4.identity()..scale(1.05)) : Matrix4.identity(),
                  decoration: BoxDecoration(
                    gradient: LinearGradient(
                      colors: _focused
                          ? [const Color(0xFF243356), const Color(0xFF1E2A49)]
                          : [const Color(0xFF1C2541), const Color(0xFF151D33)],
                      begin: Alignment.topLeft,
                      end: Alignment.bottomRight,
                    ),
                    borderRadius: BorderRadius.circular(16),
                    border: Border.all(
                      color: _focused
                          ? const Color(0xFF00E5FF)
                          : (widget.isFav ? Colors.amberAccent.withOpacity(0.5) : Colors.white.withOpacity(0.08)),
                      width: _focused ? 2.5 : 1.0,
                    ),
                    boxShadow: [
                      BoxShadow(
                        color: _focused ? const Color(0xFF00E5FF).withOpacity(0.35) : Colors.black.withOpacity(0.3),
                        blurRadius: _focused ? 16 : 8,
                        offset: const Offset(0, 4),
                      ),
                    ],
                  ),
                  child: InkWell(
                    borderRadius: BorderRadius.circular(16),
                    onTap: widget.onTap,
                    child: Stack(
                      children: [
                        Padding(
                          padding: const EdgeInsets.all(12),
                          child: Column(
                            crossAxisAlignment: CrossAxisAlignment.start,
                            children: [
                              Expanded(
                                child: Center(
                                  child: widget.channel.logo != null && widget.channel.logo!.isNotEmpty
                                      ? Image.network(
                                          widget.channel.logo!,
                                          errorBuilder: (_, __, ___) => const Icon(
                                            Icons.live_tv,
                                            size: 42,
                                            color: Color(0xFF00E5FF),
                                          ),
                                        )
                                      : const Icon(
                                          Icons.live_tv,
                                          size: 42,
                                          color: Color(0xFF00E5FF),
                                        ),
                                ),
                              ),
                              const SizedBox(height: 8),
                              Text(
                                widget.channel.name,
                                maxLines: 1,
                                overflow: TextOverflow.ellipsis,
                                style: TextStyle(
                                  fontSize: 15,
                                  fontWeight: FontWeight.bold,
                                  color: _focused ? const Color(0xFF00E5FF) : Colors.white,
                                ),
                              ),
                              if (widget.channel.group.isNotEmpty)
                                Text(
                                  widget.channel.group,
                                  maxLines: 1,
                                  overflow: TextOverflow.ellipsis,
                                  style: TextStyle(
                                    fontSize: 12,
                                    color: Colors.white.withOpacity(0.6),
                                  ),
                                ),
                            ],
                          ),
                        ),
                        Positioned(
                          top: 4,
                          right: 4,
                          child: IconButton(
                            icon: Icon(
                              widget.isFav ? Icons.star : Icons.star_border,
                              color: widget.isFav ? Colors.amberAccent : Colors.white38,
                              size: 24,
                            ),
                            onPressed: widget.onToggleFav,
                          ),
                        ),
                      ],
                    ),
                  ),
                ),
              );
            }
          }
          EOF

          # 7. PlayerScreen con soporte de teclado y flechas del control remoto
          cat << 'EOF' > lib/screens/player_screen.dart
          import 'dart:async';
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:video_player/video_player.dart';
          import '../models/channel.dart';

          class PlayerScreen extends StatefulWidget {
            final List<Channel> channels;
            final int index;

            const PlayerScreen({super.key, required this.channels, required this.index});

            @override
            State<PlayerScreen> createState() => _PlayerScreenState();
          }

          class _PlayerScreenState extends State<PlayerScreen> {
            late int _currentIndex;
            VideoPlayerController? _controller;
            bool _showControls = true;
            bool _isLoading = true;
            bool _hasError = false;
            Timer? _hideTimer;
            final FocusNode _focusNode = FocusNode();

            @override
            void initState() {
              super.initState();
              _currentIndex = widget.index;
              _playChannel();
              WidgetsBinding.instance.addPostFrameCallback((_) {
                _focusNode.requestFocus();
              });
            }

            Future<void> _playChannel() async {
              setState(() {
                _isLoading = true;
                _hasError = false;
              });

              await _controller?.dispose();
              _controller = null;

              final channel = widget.channels[_currentIndex];
              final uri = Uri.parse(channel.url);

              _controller = VideoPlayerController.networkUrl(uri);

              try {
                await _controller!.initialize();
                await _controller!.play();
                setState(() => _isLoading = false);
                _resetTimer();
              } catch (_) {
                if (mounted) {
                  setState(() {
                    _isLoading = false;
                    _hasError = true;
                  });
                }
              }
            }

            void _toggleControls() {
              setState(() {
                _showControls = !_showControls;
              });
              if (_showControls) {
                _resetTimer();
              }
            }

            void _resetTimer() {
              _hideTimer?.cancel();
              _hideTimer = Timer(const Duration(seconds: 4), () {
                if (mounted) setState(() => _showControls = false);
              });
            }

            void _nextChannel() {
              if (_currentIndex < widget.channels.length - 1) {
                _currentIndex++;
                _playChannel();
              }
            }

            void _prevChannel() {
              if (_currentIndex > 0) {
                _currentIndex--;
                _playChannel();
              }
            }

            // Manejo de eventos del control remoto
            KeyEventResult _handleKeyEvent(FocusNode node, KeyEvent event) {
              if (event is KeyDownEvent) {
                if (event.logicalKey == LogicalKeyboardKey.arrowRight ||
                    event.logicalKey == LogicalKeyboardKey.channelUp) {
                  _nextChannel();
                  _showTempControls();
                  return KeyEventResult.handled;
                } else if (event.logicalKey == LogicalKeyboardKey.arrowLeft ||
                           event.logicalKey == LogicalKeyboardKey.channelDown) {
                  _prevChannel();
                  _showTempControls();
                  return KeyEventResult.handled;
                } else if (event.logicalKey == LogicalKeyboardKey.select ||
                           event.logicalKey == LogicalKeyboardKey.enter) {
                  _toggleControls();
                  return KeyEventResult.handled;
                } else if (event.logicalKey == LogicalKeyboardKey.escape ||
                           event.logicalKey == LogicalKeyboardKey.goBack) {
                  Navigator.pop(context);
                  return KeyEventResult.handled;
                }
              }
              return KeyEventResult.ignored;
            }

            void _showTempControls() {
              setState(() => _showControls = true);
              _resetTimer();
            }

            @override
            void dispose() {
              _hideTimer?.cancel();
              _controller?.dispose();
              _focusNode.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              final channel = widget.channels[_currentIndex];

              return PopScope(
                canPop: true,
                child: Scaffold(
                  backgroundColor: Colors.black,
                  body: Focus(
                    focusNode: _focusNode,
                    onKeyEvent: _handleKeyEvent,
                    autofocus: true,
                    child: GestureDetector(
                      onTap: _toggleControls,
                      behavior: HitTestBehavior.opaque,
                      child: Stack(
                        children: [
                          Center(
                            child: _controller != null && _controller!.value.isInitialized
                                ? AspectRatio(
                                    aspectRatio: _controller!.value.aspectRatio,
                                    child: VideoPlayer(_controller!),
                                  )
                                : _isLoading
                                    ? const CircularProgressIndicator(color: Color(0xFF00E5FF))
                                    : _hasError
                                        ? const Column(
                                            mainAxisSize: MainAxisSize.min,
                                            children: [
                                              Icon(Icons.error_outline, color: Colors.redAccent, size: 54),
                                              SizedBox(height: 12),
                                              Text(
                                                'Señal no disponible en este momento',
                                                style: TextStyle(color: Colors.white70, fontSize: 16),
                                              ),
                                            ],
                                          )
                                        : const SizedBox.shrink(),
                          ),
                          AnimatedOpacity(
                            opacity: _showControls ? 1.0 : 0.0,
                            duration: const Duration(milliseconds: 250),
                            child: IgnorePointer(
                              ignoring: !_showControls,
                              child: Container(
                                decoration: const BoxDecoration(
                                  gradient: LinearGradient(
                                    colors: [Colors.black87, Colors.transparent, Colors.black87],
                                    begin: Alignment.topCenter,
                                    end: Alignment.bottomCenter,
                                  ),
                                ),
                                child: SafeArea(
                                  child: Column(
                                    mainAxisAlignment: MainAxisAlignment.spaceBetween,
                                    children: [
                                      Padding(
                                        padding: const EdgeInsets.symmetric(horizontal: 24, vertical: 16),
                                        child: Row(
                                          children: [
                                            IconButton(
                                              icon: const Icon(Icons.arrow_back_ios_new, color: Colors.white, size: 28),
                                              onPressed: () => Navigator.pop(context),
                                            ),
                                            const SizedBox(width: 12),
                                            Expanded(
                                              child: Column(
                                                crossAxisAlignment: CrossAxisAlignment.start,
                                                children: [
                                                  Text(
                                                    channel.name,
                                                    style: const TextStyle(
                                                      color: Colors.white,
                                                      fontSize: 22,
                                                      fontWeight: FontWeight.bold,
                                                    ),
                                                    maxLines: 1,
                                                    overflow: TextOverflow.ellipsis,
                                                  ),
                                                  if (channel.group.isNotEmpty)
                                                    Text(
                                                      channel.group,
                                                      style: const TextStyle(color: Color(0xFF00E5FF), fontSize: 14),
                                                    ),
                                                ],
                                              ),
                                            ),
                                          ],
                                        ),
                                      ),
                                      Padding(
                                        padding: const EdgeInsets.symmetric(horizontal: 32),
                                        child: Row(
                                          mainAxisAlignment: MainAxisAlignment.spaceBetween,
                                          children: [
                                            IconButton(
                                              icon: const Icon(Icons.skip_previous, color: Colors.white, size: 50),
                                              onPressed: _currentIndex > 0 ? _prevChannel : null,
                                            ),
                                            IconButton(
                                              icon: const Icon(Icons.skip_next, color: Colors.white, size: 50),
                                              onPressed: _currentIndex < widget.channels.length - 1 ? _nextChannel : null,
                                            ),
                                          ],
                                        ),
                                      ),
                                      Padding(
                                        padding: const EdgeInsets.all(20),
                                        child: Row(
                                          mainAxisAlignment: MainAxisAlignment.center,
                                          children: [
                                            Container(
                                              padding: const EdgeInsets.symmetric(horizontal: 16, vertical: 8),
                                              decoration: BoxDecoration(
                                                color: const Color(0xFF1C2541),
                                                borderRadius: BorderRadius.circular(24),
                                                border: Border.all(color: Colors.white.withOpacity(0.1)),
                                              ),
                                              child: const Row(
                                                children: [
                                                  Icon(Icons.circle, color: Colors.redAccent, size: 12),
                                                  SizedBox(width: 8),
                                                  Text(
                                                    'EN VIVO • Usa Flechas ◄ ► para cambiar canal',
                                                    style: TextStyle(color: Colors.white, fontSize: 13, fontWeight: FontWeight.bold),
                                                  ),
                                                ],
                                              ),
                                            ),
                                          ],
                                        ),
                                      ),
                                    ],
                                  ),
                                ),
                              ),
                            ),
                          ),
                        ],
                      ),
                    ),
                  ),
                ),
              );
            }
          }
          EOF

          # 8. Logo Oficial de Oso Polar y Banner Panorámico para Android TV (320x180)
          cat << 'EOF' > /tmp/polar_bear.svg
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
