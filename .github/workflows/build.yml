name: Build Polar TV APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Configurar proyecto Android y renombrar a Polar TV
        run: |
          # 1. Respaldar Manifest de streaming de Claude
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml.bak
          
          # 2. Generar estructura Android con nombre Polar TV
          flutter create --platforms=android --project-name polartv --org com.polar .
          
          # 3. Restaurar Manifest de Claude
          cp /tmp/AndroidManifest.xml.bak android/app/src/main/AndroidManifest.xml
          
          # 4. Inyectar nombre visible "Polar TV" en AndroidManifest
          sed -i 's/android:label="[^"]*"/android:label="Polar TV"/g' android/app/src/main/AndroidManifest.xml
          
          # 5. Cambiar título interno en main.dart si existe
          if [ -f lib/main.dart ]; then
            sed -i "s/title: '[^']*'/title: 'Polar TV'/g" lib/main.dart
            sed -i 's/title: "[^"]*"/title: "Polar TV"/g' lib/main.dart
          fi

          # 6. Forzar compileSdk 36 para compatibilidad con plugins
          cat << 'EOF' >> android/build.gradle

          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          compileSdkVersion 36
                      }
                  }
              }
          }
          EOF

          # 7. Obtener paquetes de Flutter
          flutter pub get

      - name: Compilar APK con Gradle directo
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Localizar APK generado
        run: |
          mkdir -p apk_output
          find . -name "*.apk" -type f -exec cp {} apk_output/PolarTV-release.apk \;
          ls -la apk_output/

      - name: Subir APK de Polar TV
        uses: actions/upload-artifact@v4
        with:
          name: Polar-TV-APK
          path: apk_output/PolarTV-release.apk
