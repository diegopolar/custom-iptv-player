name: Build Polar TV APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Instalar ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Configurar Polar TV (UI Premium, Favoritos, Listas Fijas, PiP y Logo Polar)
        run: |
          # 1. Regenerar estructura Android limpia
          flutter create --platforms=android --project-name polartv --org com.polar .

          # 2. Configurar AndroidManifest con soporte PiP, pantalla encendida y streaming
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>

              <application
                  android:label="Polar TV"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:taskAffinity=""
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:supportsPictureInPicture="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme"
                        />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF

          # 3. PiP nativo en MainActivity.kt
          mkdir -p android/app/src/main/kotlin/com/polar/polartv
          cat << 'EOF' > android/app/src/main/kotlin/com/polar/polartv/MainActivity.kt
          package com.polar.polartv

          import android.app.PictureInPictureParams
          import android.os.Build
          import android.util.Rational
          import io.flutter.embedding.android.FlutterActivity

          class MainActivity: FlutterActivity() {
              override fun onUserLeaveHint() {
                  super.onUserLeaveHint()
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      try {
                          val params = PictureInPictureParams.Builder()
                              .setAspectRatio(Rational(16, 9))
                              .build()
                          enterPictureInPictureMode(params)
                      } catch (e: Exception) {
                          enterPictureInPictureMode()
                      }
                  }
              }
          }
          EOF

          # 4. Tema Ártico y Título en main.dart
          cat << 'EOF' > lib/main.dart
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'screens/home_screen.dart';

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            SystemChrome.setSystemUIOverlayStyle(
              const SystemUiOverlayStyle(
                statusBarColor: Colors.transparent,
                statusBarIconBrightness: Brightness.light,
              ),
            );
            runApp(const PolarTvApp());
          }

          class PolarTvApp extends StatelessWidget {
            const PolarTvApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'Polar TV',
                debugShowCheckedModeBanner: false,
                theme: ThemeData.dark().copyWith(
                  scaffoldBackgroundColor: const Color(0xFF0B132B),
                  primaryColor: const Color(0xFF00E5FF),
                  colorScheme: const ColorScheme.dark(
                    primary: Color(0xFF00E5FF),
                    secondary: Color(0xFF48CAE4),
                    surface: Color(0xFF1C2541),
                  ),
                  appBarTheme: const AppBarTheme(
                    backgroundColor: Color(0xFF0B132B),
                    elevation: 0,
                    centerTitle: true,
                    titleTextStyle: TextStyle(
                      fontSize: 22,
                      fontWeight: FontWeight.bold,
                      letterSpacing: 1.5,
                      color: Color(0xFF00E5FF),
                    ),
                  ),
                ),
                home: const HomeScreen(),
              );
            }
          }
          EOF

          # 5. HomeScreen rediseñado: Listas precargadas visibles y soporte para añadir personalizadas
          cat << 'EOF' > lib/screens/home_screen.dart
          import 'package:flutter/material.dart';
          import '../models/channel.dart';
          import '../services/playlist_storage.dart';
          import 'channels_screen.dart';

          class HomeScreen extends StatefulWidget {
            const HomeScreen({super.key});

            @override
            State<HomeScreen> createState() => _HomeScreenState();
          }

          class _HomeScreenState extends State<HomeScreen> {
            final PlaylistStorage _store = PlaylistStorage();
            final TextEditingController _urlCtrl = TextEditingController();
            final TextEditingController _nameCtrl = TextEditingController();
            List<Playlist> _playlists = [];
            bool _loading = true;

            static final List<Playlist> _defaults = [
              const Playlist(
                id: 'pe',
                name: 'Canales Perú 🇵🇪',
                source: 'https://iptv-org.github.io/iptv/countries/pe.m3u',
              ),
              const Playlist(
                id: 'global',
                name: 'Canales Globales 🌐',
                source: 'https://iptv-org.github.io/iptv/index.m3u',
              ),
            ];

            @override
            void initState() {
              super.initState();
              _load();
            }

            Future<void> _load() async {
              setState(() => _loading = true);
              final saved = await _store.getAll();
              if (saved.isEmpty) {
                for (final p in _defaults) {
                  await _store.add(p);
                }
                _playlists = List.from(_defaults);
              } else {
                _playlists = saved;
              }
              if (mounted) setState(() => _loading = false);
            }

            void _showAddDialog() {
              _urlCtrl.clear();
              _nameCtrl.clear();
              showModalBottomSheet(
                context: context,
                isScrollControlled: true,
                backgroundColor: const Color(0xFF1C2541),
                shape: const RoundedRectangleBorder(
                  borderRadius: BorderRadius.vertical(top: Radius.circular(24)),
                ),
                builder: (ctx) => Padding(
                  padding: EdgeInsets.only(
                    left: 20,
                    right: 20,
                    top: 24,
                    bottom: MediaQuery.of(ctx).viewInsets.bottom + 24,
                  ),
                  child: Column(
                    mainAxisSize: MainAxisSize.min,
                    crossAxisAlignment: CrossAxisAlignment.stretch,
                    children: [
                      const Text(
                        'Añadir Lista M3U',
                        style: TextStyle(fontSize: 20, fontWeight: FontWeight.bold, color: Color(0xFF00E5FF)),
                      ),
                      const SizedBox(height: 16),
                      TextField(
                        controller: _nameCtrl,
                        decoration: InputDecoration(
                          labelText: 'Nombre de la lista (ej: Deportes)',
                          filled: true,
                          fillColor: const Color(0xFF0B132B),
                          border: OutlineInputBorder(borderRadius: BorderRadius.circular(12)),
                        ),
                      ),
                      const SizedBox(height: 12),
                      TextField(
                        controller: _urlCtrl,
                        decoration: InputDecoration(
                          labelText: 'URL de la lista .m3u o .m3u8',
                          filled: true,
                          fillColor: const Color(0xFF0B132B),
                          border: OutlineInputBorder(borderRadius: BorderRadius.circular(12)),
                        ),
                      ),
                      const SizedBox(height: 20),
                      ElevatedButton(
                        style: ElevatedButton.styleFrom(
                          backgroundColor: const Color(0xFF00E5FF),
                          foregroundColor: const Color(0xFF0B132B),
                          padding: const EdgeInsets.symmetric(vertical: 14),
                          shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(12)),
                        ),
                        onPressed: () async {
                          final url = _urlCtrl.text.trim();
                          final name = _nameCtrl.text.trim();
                          if (url.isNotEmpty) {
                            final pl = Playlist(
                              id: DateTime.now().millisecondsSinceEpoch.toString(),
                              name: name.isEmpty ? 'Mi Lista' : name,
                              source: url,
                            );
                            await _store.add(pl);
                            Navigator.pop(ctx);
                            _load();
                          }
                        },
                        child: const Text('Guardar y Cargar', style: TextStyle(fontWeight: FontWeight.bold, fontSize: 16)),
                      )
                    ],
                  ),
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: Row(
                    mainAxisSize: MainAxisSize.min,
                    children: [
                      Container(
                        padding: const EdgeInsets.all(6),
                        decoration: BoxDecoration(
                          color: const Color(0xFF00E5FF).withOpacity(0.15),
                          shape: BoxShape.circle,
                        ),
                        child: const Icon(Icons.tv, color: Color(0xFF00E5FF), size: 22),
                      ),
                      const SizedBox(width: 10),
                      const Text('POLAR TV'),
                    ],
                  ),
                  actions: [
                    IconButton(
                      icon: const Icon(Icons.add_circle_outline, color: Color(0xFF00E5FF), size: 28),
                      tooltip: 'Añadir Lista',
                      onPressed: _showAddDialog,
                    ),
                  ],
                ),
                body: _loading
                    ? const Center(child: CircularProgressIndicator(color: Color(0xFF00E5FF)))
                    : ListView(
                        padding: const EdgeInsets.all(18),
                        children: [
                          const Text(
                            'Mis Listas de Transmisión',
                            style: TextStyle(fontSize: 16, fontWeight: FontWeight.w600, color: Colors.white70),
                          ),
                          const SizedBox(height: 14),
                          ..._playlists.map((pl) => Container(
                                margin: const EdgeInsets.only(bottom: 14),
                                decoration: BoxDecoration(
                                  gradient: const LinearGradient(
                                    colors: [Color(0xFF1C2541), Color(0xFF16203B)],
                                    begin: Alignment.topLeft,
                                    end: Alignment.bottomRight,
                                  ),
                                  borderRadius: BorderRadius.circular(16),
                                  border: Border.all(color: Colors.white.withOpacity(0.08)),
                                  boxShadow: [
                                    BoxShadow(
                                      color: Colors.black.withOpacity(0.3),
                                      blurRadius: 10,
                                      offset: const Offset(0, 4),
                                    ),
                                  ],
                                ),
                                child: ListTile(
                                  contentPadding: const EdgeInsets.symmetric(horizontal: 18, vertical: 10),
                                  leading: CircleAvatar(
                                    backgroundColor: const Color(0xFF00E5FF).withOpacity(0.15),
                                    radius: 24,
                                    child: Icon(
                                      pl.name.contains('Perú') ? Icons.flag : Icons.public,
                                      color: const Color(0xFF00E5FF),
                                    ),
                                  ),
                                  title: Text(
                                    pl.name,
                                    style: const TextStyle(fontSize: 17, fontWeight: FontWeight.bold, color: Colors.white),
                                  ),
                                  subtitle: Text(
                                    pl.source,
                                    maxLines: 1,
                                    overflow: TextOverflow.ellipsis,
                                    style: TextStyle(fontSize: 12, color: Colors.white.withOpacity(0.5)),
                                  ),
                                  trailing: const Icon(Icons.arrow_forward_ios, color: Color(0xFF00E5FF), size: 18),
                                  onTap: () {
                                    Navigator.push(
                                      context,
                                      MaterialPageRoute(builder: (_) => ChannelsScreen(playlist: pl)),
                                    );
                                  },
                                ),
                              )),
                        ],
                      ),
              );
            }
          }
          EOF

          # 6. ChannelsScreen rediseñado: Cuadrícula didáctica, Favoritos instantáneos y Filtro por categorías
          cat << 'EOF' > lib/screens/channels_screen.dart
          import 'dart:convert';
          import 'package:flutter/material.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import '../models/channel.dart';
          import '../services/playlist_storage.dart';
          import 'player_screen.dart';

          class ChannelsScreen extends StatefulWidget {
            final Playlist playlist;
            const ChannelsScreen({super.key, required this.playlist});

            @override
            State<ChannelsScreen> createState() => _ChannelsScreenState();
          }

          class _ChannelsScreenState extends State<ChannelsScreen> {
            List<Channel> _all = [];
            List<Channel> _filtered = [];
            Set<String> _favUrls = {};
            String _selectedCategory = 'Todos';
            String _query = '';
            bool _loading = true;
            bool _onlyFavs = false;

            @override
            void initState() {
              super.initState();
              _init();
            }

            Future<void> _init() async {
              final prefs = await SharedPreferences.getInstance();
              final favs = prefs.getStringList('polar_favs') ?? [];
              _favUrls = favs.toSet();

              try {
                final channels = await PlaylistStorage().loadChannels(widget.playlist);
                _all = channels;
                _applyFilter();
              } catch (_) {}

              if (mounted) setState(() => _loading = false);
            }

            Future<void> _toggleFav(Channel c) async {
              setState(() {
                if (_favUrls.contains(c.url)) {
                  _favUrls.remove(c.url);
                } else {
                  _favUrls.add(c.url);
                }
              });
              final prefs = await SharedPreferences.getInstance();
              await prefs.setStringList('polar_favs', _favUrls.toList());
              _applyFilter();
            }

            void _applyFilter() {
              setState(() {
                _filtered = _all.where((c) {
                  final matchesQuery = c.name.toLowerCase().contains(_query.toLowerCase());
                  final matchesCat = _selectedCategory == 'Todos' || c.group == _selectedCategory;
                  final matchesFav = !_onlyFavs || _favUrls.contains(c.url);
                  return matchesQuery && matchesCat && matchesFav;
                }).toList();
              });
            }

            List<String> get _categories {
              final set = <String>{'Todos'};
              for (final c in _all) {
                if (c.group.isNotEmpty) set.add(c.group);
              }
              return set.toList();
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: Text(widget.playlist.name),
                  actions: [
                    IconButton(
                      icon: Icon(
                        _onlyFavs ? Icons.star : Icons.star_border,
                        color: _onlyFavs ? Colors.amberAccent : Colors.white70,
                        size: 28,
                      ),
                      tooltip: 'Ver Favoritos',
                      onPressed: () {
                        setState(() => _onlyFavs = !_onlyFavs);
                        _applyFilter();
                      },
                    ),
                  ],
                ),
                body: _loading
                    ? const Center(
                        child: Column(
                          mainAxisAlignment: MainAxisAlignment.center,
                          children: [
                            CircularProgressIndicator(color: Color(0xFF00E5FF)),
                            SizedBox(height: 16),
                            Text('Cargando señales de Polar TV...', style: TextStyle(color: Colors.white70)),
                          ],
                        ),
                      )
                    : Column(
                        children: [
                          // Buscador
                          Padding(
                            padding: const EdgeInsets.symmetric(horizontal: 16, vertical: 8),
                            child: TextField(
                              style: const TextStyle(color: Colors.white),
                              decoration: InputDecoration(
                                hintText: 'Buscar canal...',
                                hintStyle: const TextStyle(color: Colors.white38),
                                prefixIcon: const Icon(Icons.search, color: Color(0xFF00E5FF)),
                                filled: true,
                                fillColor: const Color(0xFF1C2541),
                                contentPadding: const EdgeInsets.symmetric(vertical: 0),
                                border: OutlineInputBorder(
                                  borderRadius: BorderRadius.circular(14),
                                  borderSide: BorderSide.none,
                                ),
                              ),
                              onChanged: (v) {
                                _query = v;
                                _applyFilter();
                              },
                            ),
                          ),

                          // Chips de categorías
                          if (!_onlyFavs && _categories.length > 1)
                            SizedBox(
                              height: 44,
                              child: ListView.builder(
                                scrollDirection: Axis.horizontal,
                                padding: const EdgeInsets.symmetric(horizontal: 12),
                                itemCount: _categories.length,
                                itemBuilder: (ctx, i) {
                                  final cat = _categories[i];
                                  final isSel = cat == _selectedCategory;
                                  return Padding(
                                    padding: const EdgeInsets.symmetric(horizontal: 4),
                                    child: ChoiceChip(
                                      label: Text(cat),
                                      selected: isSel,
                                      selectedColor: const Color(0xFF00E5FF),
                                      backgroundColor: const Color(0xFF1C2541),
                                      labelStyle: TextStyle(
                                        color: isSel ? const Color(0xFF0B132B) : Colors.white70,
                                        fontWeight: isSel ? FontWeight.bold : FontWeight.normal,
                                      ),
                                      onSelected: (val) {
                                        if (val) {
                                          setState(() => _selectedCategory = cat);
                                          _applyFilter();
                                        }
                                      },
                                    ),
                                  );
                                },
                              ),
                            ),

                          const SizedBox(height: 6),

                          // Cuadrícula didáctica de canales
                          Expanded(
                            child: _filtered.isEmpty
                                ? Center(
                                    child: Text(
                                      _onlyFavs ? 'No tienes canales favoritos aún' : 'No se encontraron canales',
                                      style: const TextStyle(color: Colors.white54, fontSize: 16),
                                    ),
                                  )
                                : GridView.builder(
                                    padding: const EdgeInsets.all(12),
                                    gridDelegate: const SliverGridDelegateWithFixedCrossAxisCount(
                                      crossAxisCount: 2,
                                      childAspectRatio: 1.35,
                                      crossAxisSpacing: 12,
                                      mainAxisSpacing: 12,
                                    ),
                                    itemCount: _filtered.length,
                                    itemBuilder: (ctx, i) {
                                      final c = _filtered[i];
                                      final isFav = _favUrls.contains(c.url);
                                      return InkWell(
                                        borderRadius: BorderRadius.circular(16),
                                        onTap: () {
                                          Navigator.push(
                                            context,
                                            MaterialPageRoute(
                                              builder: (_) => PlayerScreen(
                                                channels: _filtered,
                                                initialIndex: i,
                                              ),
                                            ),
                                          );
                                        },
                                        child: Container(
                                          decoration: BoxDecoration(
                                            gradient: const LinearGradient(
                                              colors: [Color(0xFF1C2541), Color(0xFF151D33)],
                                              begin: Alignment.topLeft,
                                              end: Alignment.bottomRight,
                                            ),
                                            borderRadius: BorderRadius.circular(16),
                                            border: Border.all(
                                              color: isFav
                                                  ? Colors.amberAccent.withOpacity(0.5)
                                                  : Colors.white.withOpacity(0.06),
                                            ),
                                          ),
                                          child: Stack(
                                            children: [
                                              Padding(
                                                padding: const EdgeInsets.all(12),
                                                child: Column(
                                                  crossAxisAlignment: CrossAxisAlignment.start,
                                                  children: [
                                                    // Logo o ícono del canal
                                                    Expanded(
                                                      child: Center(
                                                        child: c.logo != null && c.logo!.isNotEmpty
                                                            ? Image.network(
                                                                c.logo!,
                                                                errorBuilder: (_, __, ___) => const Icon(
                                                                  Icons.live_tv,
                                                                  size: 40,
                                                                  color: Color(0xFF00E5FF),
                                                                ),
                                                              )
                                                            : const Icon(
                                                                Icons.live_tv,
                                                                size: 40,
                                                                color: Color(0xFF00E5FF),
                                                              ),
                                                      ),
                                                    ),
                                                    const SizedBox(height: 8),
                                                    // Nombre del canal
                                                    Text(
                                                      c.name,
                                                      maxLines: 1,
                                                      overflow: TextOverflow.ellipsis,
                                                      style: const TextStyle(
                                                        fontSize: 14,
                                                        fontWeight: FontWeight.bold,
                                                        color: Colors.white,
                                                      ),
                                                    ),
                                                    if (c.group.isNotEmpty)
                                                      Text(
                                                        c.group,
                                                        maxLines: 1,
                                                        overflow: TextOverflow.ellipsis,
                                                        style: TextStyle(
                                                          fontSize: 11,
                                                          color: const Color(0xFF00E5FF).withOpacity(0.8),
                                                        ),
                                                      ),
                                                  ],
                                                ),
                                              ),
                                              // Botón de Favorito
                                              Positioned(
                                                top: 4,
                                                right: 4,
                                                child: IconButton(
                                                  icon: Icon(
                                                    isFav ? Icons.star : Icons.star_border,
                                                    color: isFav ? Colors.amberAccent : Colors.white38,
                                                    size: 22,
                                                  ),
                                                  onPressed: () => _toggleFav(c),
                                                ),
                                              ),
                                            ],
                                          ),
                                        ),
                                      );
                                    },
                                  ),
                          ),
                        ],
                      ),
              );
            }
          }
          EOF

          # 7. Ajustar orientación vertical y pantalla encendida en player_screen.dart
          python3 -c '
          import os

          player_path = "lib/screens/player_screen.dart"
          if os.path.exists(player_path):
              with open(player_path, "r") as f:
                  code = f.read()
              
              code = code.replace("DeviceOrientation.landscapeLeft,", "DeviceOrientation.portraitUp, DeviceOrientation.landscapeLeft,")
              with open(player_path, "w") as f:
                  f.write(code)
          '

          # 8. Generar Logo Oficial de Oso Polar en alta resolución
          cat << 'EOF' > /tmp/polar_bear.svg
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
            <defs>
              <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#0B132B"/>
                <stop offset="100%" stop-color="#1C2541"/>
              </linearGradient>
              <linearGradient id="ice" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#FFFFFF"/>
                <stop offset="100%" stop-color="#D0EDF2"/>
              </linearGradient>
            </defs>
            <rect width="512" height="512" rx="120" fill="url(#bg)"/>
            <circle cx="150" cy="155" r="46" fill="#E2F6F9"/>
            <circle cx="150" cy="155" r="26" fill="#A8D5DE"/>
            <circle cx="362" cy="155" r="46" fill="#E2F6F9"/>
            <circle cx="362" cy="155" r="26" fill="#A8D5DE"/>
            <ellipse cx="256" cy="285" rx="160" ry="140" fill="url(#ice)"/>
            <circle cx="195" cy="245" r="13" fill="#0B132B"/>
            <circle cx="199" cy="241" r="4.5" fill="#FFFFFF"/>
            <circle cx="317" cy="245" r="13" fill="#0B132B"/>
            <circle cx="321" cy="241" r="4.5" fill="#FFFFFF"/>
            <ellipse cx="256" cy="325" rx="72" ry="58" fill="#F8FEFF"/>
            <path d="M 230 300 Q 256 290 282 300 Q 256 332 230 300 Z" fill="#0B132B"/>
            <line x1="256" y1="316" x2="256" y2="340" stroke="#0B132B" stroke-width="6" stroke-linecap="round"/>
            <path d="M 236 340 Q 256 352 276 340" stroke="#0B132B" stroke-width="6" fill="none" stroke-linecap="round"/>
            <text x="256" y="468" font-family="sans-serif" font-weight="900" font-size="38" fill="#00E5FF" text-anchor="middle" letter-spacing="4">POLAR TV</text>
          </svg>
          EOF

          RES="android/app/src/main/res"
          convert -background none /tmp/polar_bear.svg -resize 48x48   $RES/mipmap-mdpi/ic_launcher.png
          convert -background none /tmp/polar_bear.svg -resize 72x72   $RES/mipmap-hdpi/ic_launcher.png
          convert -background none /tmp/polar_bear.svg -resize 96x96   $RES/mipmap-xhdpi/ic_launcher.png
          convert -background none /tmp/polar_bear.svg -resize 144x144 $RES/mipmap-xxhdpi/ic_launcher.png
          convert -background none /tmp/polar_bear.svg -resize 192x192 $RES/mipmap-xxxhdpi/ic_launcher.png

          # 9. Forzar compileSdk 36 en plugins
          cat << 'EOF' >> android/build.gradle

          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          compileSdkVersion 36
                      }
                  }
              }
          }
          EOF

          flutter pub get

      - name: Compilar APK con Gradle directamente
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Extraer APK y preparar descarga
        run: |
          mkdir -p output_apk
          find . -type f -name "*release*.apk" -exec cp {} output_apk/PolarTV.apk \;
          ls -lh output_apk/

      - name: Subir APK de Polar TV
        uses: actions/upload-artifact@v4
        with:
          name: Polar-TV-APK
