name: Build Polar TV APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Instalar ImageMagick y configurar permisos
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          mkdir -p /home/runner/.android /home/runner/.config/.android
          sudo chown -R $USER:$USER /home/runner
          
          keytool -genkey -v -keystore /home/runner/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true
          cp /home/runner/.android/debug.keystore /home/runner/.config/.android/debug.keystore || true

      - name: Configurar Polar TV (Look Negro y Menta, Fix Retroceso Doble y Grid Ordenado)
        run: |
          # 1. Regenerar base Android limpia
          flutter create --platforms=android --project-name polartv --org com.polar .

          # 2. Configurar AndroidManifest
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>

              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
              <uses-feature android:name="android.software.leanback" android:required="false" />

              <application
                  android:label="Polar TV"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:banner="@drawable/tv_banner"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:taskAffinity=""
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:supportsPictureInPicture="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme"
                        />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF

          # 3. MainActivity.kt con pantalla siempre encendida
          mkdir -p android/app/src/main/kotlin/com/polar/polartv
          cat << 'EOF' > android/app/src/main/kotlin/com/polar/polartv/MainActivity.kt
          package com.polar.polartv

          import android.app.PictureInPictureParams
          import android.os.Build
          import android.os.Bundle
          import android.util.Rational
          import android.view.WindowManager
          import io.flutter.embedding.android.FlutterActivity

          class MainActivity: FlutterActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
              }

              override fun onUserLeaveHint() {
                  super.onUserLeaveHint()
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      try {
                          val params = PictureInPictureParams.Builder()
                              .setAspectRatio(Rational(16, 9))
                              .build()
                          enterPictureInPictureMode(params)
                      } catch (e: Exception) {
                          enterPictureInPictureMode()
                      }
                  }
              }
          }
          EOF

          # 4. Tema Negro Profundo & Menta Glacial en main.dart
          cat << 'EOF' > lib/main.dart
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'screens/home_screen.dart';

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            SystemChrome.setSystemUIOverlayStyle(
              const SystemUiOverlayStyle(
                statusBarColor: Colors.transparent,
                statusBarIconBrightness: Brightness.light,
              ),
            );
            runApp(const PolarTvApp());
          }

          class PolarTvApp extends StatelessWidget {
            const PolarTvApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'Polar TV',
                debugShowCheckedModeBanner: false,
                theme: ThemeData.dark().copyWith(
                  scaffoldBackgroundColor: const Color(0xFF0A0D0F),
                  primaryColor: const Color(0xFF00F5D4),
                  colorScheme: const ColorScheme.dark(
                    primary: Color(0xFF00F5D4),
                    secondary: Color(0xFF2EC4B6),
                    surface: Color(0xFF13191C),
                  ),
                  appBarTheme: const AppBarTheme(
                    backgroundColor: Color(0xFF0A0D0F),
                    elevation: 0,
                    centerTitle: false,
                    titleTextStyle: TextStyle(
                      fontSize: 20,
                      fontWeight: FontWeight.w800,
                      letterSpacing: 2.0,
                      color: Color(0xFFF1FAF8),
                    ),
                  ),
                ),
                home: const HomeScreen(),
              );
            }
          }
          EOF

          # 5. HomeScreen con diseño Negro y Menta
          cat << 'EOF' > lib/screens/home_screen.dart
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import '../models/channel.dart';
          import '../services/playlist_storage.dart';
          import 'channels_screen.dart';

          class HomeScreen extends StatefulWidget {
            const HomeScreen({super.key});

            @override
            State<HomeScreen> createState() => _HomeScreenState();
          }

          class _HomeScreenState extends State<HomeScreen> {
            final PlaylistStorage _store = PlaylistStorage();
            List<Playlist> _playlists = [];
            bool _loading = true;

            static final List<Playlist> _defaults = [
              const Playlist(
                id: 'pe',
                name: 'Canales Perú 🇵🇪',
                source: 'https://iptv-org.github.io/iptv/countries/pe.m3u',
                isLocal: false,
              ),
              const Playlist(
                id: 'global',
                name: 'Canales Globales 🌐',
                source: 'https://iptv-org.github.io/iptv/index.m3u',
                isLocal: false,
              ),
            ];

            @override
            void initState() {
              super.initState();
              _load();
            }

            Future<void> _load() async {
              setState(() => _loading = true);
              final saved = await _store.getAll();
              if (saved.isEmpty) {
                for (final p in _defaults) {
                  await _store.add(p);
                }
                _playlists = List.from(_defaults);
              } else {
                _playlists = saved;
              }
              if (mounted) setState(() => _loading = false);
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: Row(
                    children: [
                      Container(
                        padding: const EdgeInsets.all(7),
                        decoration: BoxDecoration(
                          color: const Color(0xFF00F5D4).withOpacity(0.12),
                          borderRadius: BorderRadius.circular(10),
                          border: Border.all(color: const Color(0xFF00F5D4).withOpacity(0.3)),
                        ),
                        child: const Icon(Icons.tv_rounded, color: Color(0xFF00F5D4), size: 22),
                      ),
                      const SizedBox(width: 14),
                      const Text('POLAR TV', style: TextStyle(fontWeight: FontWeight.w900, fontSize: 22, letterSpacing: 2)),
                      const SizedBox(width: 10),
                      Container(
                        padding: const EdgeInsets.symmetric(horizontal: 8, vertical: 3),
                        decoration: BoxDecoration(
                          color: const Color(0xFF00F5D4).withOpacity(0.15),
                          borderRadius: BorderRadius.circular(6),
                        ),
                        child: const Text('EXECUTIVE', style: TextStyle(color: Color(0xFF00F5D4), fontSize: 10, fontWeight: FontWeight.bold, letterSpacing: 1)),
                      ),
                    ],
                  ),
                ),
                body: _loading
                    ? const Center(child: CircularProgressIndicator(color: Color(0xFF00F5D4)))
                    : ListView(
                        padding: const EdgeInsets.symmetric(horizontal: 32, vertical: 24),
                        children: [
                          const Text(
                            'BIBLIOTECA DE SEÑALES DISPONIBLES',
                            style: TextStyle(fontSize: 12, fontWeight: FontWeight.w700, color: Colors.white38, letterSpacing: 1.8),
                          ),
                          const SizedBox(height: 18),
                          ..._playlists.asMap().entries.map((entry) => _TvFocusCard(
                                autofocus: entry.key == 0,
                                onTap: () {
                                  Navigator.push(
                                    context,
                                    MaterialPageRoute(builder: (_) => ChannelsScreen(playlist: entry.value)),
                                  );
                                },
                                child: Padding(
                                  padding: const EdgeInsets.symmetric(horizontal: 22, vertical: 18),
                                  child: Row(
                                    children: [
                                      Container(
                                        padding: const EdgeInsets.all(12),
                                        decoration: BoxDecoration(
                                          color: const Color(0xFF00F5D4).withOpacity(0.1),
                                          borderRadius: BorderRadius.circular(12),
                                        ),
                                        child: Icon(
                                          entry.value.name.contains('Perú') ? Icons.flag_rounded : Icons.public_rounded,
                                          color: const Color(0xFF00F5D4),
                                          size: 26,
                                        ),
                                      ),
                                      const SizedBox(width: 20),
                                      Expanded(
                                        child: Column(
                                          crossAxisAlignment: CrossAxisAlignment.start,
                                          children: [
                                            Text(
                                              entry.value.name,
                                              style: const TextStyle(fontSize: 18, fontWeight: FontWeight.w800, color: Colors.white),
                                            ),
                                            const SizedBox(height: 4),
                                            Text(
                                              entry.value.source,
                                              maxLines: 1,
                                              overflow: TextOverflow.ellipsis,
                                              style: TextStyle(fontSize: 12, color: Colors.white.withOpacity(0.35)),
                                            ),
                                          ],
                                        ),
                                      ),
                                      const Icon(Icons.arrow_forward_ios_rounded, color: Color(0xFF00F5D4), size: 18),
                                    ],
                                  ),
                                ),
                              )),
                        ],
                      ),
              );
            }
          }

          class _TvFocusCard extends StatefulWidget {
            final Widget child;
            final VoidCallback onTap;
            final bool autofocus;
            const _TvFocusCard({required this.child, required this.onTap, this.autofocus = false});

            @override
            State<_TvFocusCard> createState() => _TvFocusCardState();
          }

          class _TvFocusCardState extends State<_TvFocusCard> {
            bool _focused = false;

            @override
            Widget build(BuildContext context) {
              return Focus(
                autofocus: widget.autofocus,
                onFocusChange: (has) => setState(() => _focused = has),
                onKeyEvent: (node, event) {
                  if (event is KeyDownEvent) {
                    if (event.logicalKey == LogicalKeyboardKey.select ||
                        event.logicalKey == LogicalKeyboardKey.enter ||
                        event.logicalKey == LogicalKeyboardKey.numpadEnter ||
                        event.logicalKey == LogicalKeyboardKey.gameButtonA) {
                      widget.onTap();
                      return KeyEventResult.handled;
                    }
                  }
                  return KeyEventResult.ignored;
                },
                child: AnimatedContainer(
                  duration: const Duration(milliseconds: 140),
                  margin: const EdgeInsets.only(bottom: 16),
                  transform: _focused ? (Matrix4.identity()..scale(1.02)) : Matrix4.identity(),
                  decoration: BoxDecoration(
                    color: _focused ? const Color(0xFF162325) : const Color(0xFF11171A),
                    borderRadius: BorderRadius.circular(14),
                    border: Border.all(
                      color: _focused ? const Color(0xFF00F5D4) : Colors.white.withOpacity(0.06),
                      width: _focused ? 2.5 : 1.0,
                    ),
                    boxShadow: [
                      BoxShadow(
                        color: _focused ? const Color(0xFF00F5D4).withOpacity(0.3) : Colors.black.withOpacity(0.3),
                        blurRadius: _focused ? 18 : 6,
                        offset: const Offset(0, 3),
                      ),
                    ],
                  ),
                  child: InkWell(
                    borderRadius: BorderRadius.circular(14),
                    onTap: widget.onTap,
                    child: widget.child,
                  ),
                ),
              );
            }
          }
          EOF

          # 6. ChannelsScreen: Canales ordenados alfabéticamente y parrilla ejecutiva
          cat << 'EOF' > lib/screens/channels_screen.dart
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import '../models/channel.dart';
          import '../services/playlist_storage.dart';
          import 'player_screen.dart';

          class ChannelsScreen extends StatefulWidget {
            final Playlist playlist;
            const ChannelsScreen({super.key, required this.playlist});

            @override
            State<ChannelsScreen> createState() => _ChannelsScreenState();
          }

          class _ChannelsScreenState extends State<ChannelsScreen> {
            List<Channel> _all = [];
            List<Channel> _filtered = [];
            Set<String> _favUrls = {};
            String _selectedCategory = 'Todos';
            String _query = '';
            bool _loading = true;
            bool _onlyFavs = false;
            bool _showSearch = false;

            @override
            void initState() {
              super.initState();
              _init();
            }

            Future<void> _init() async {
              final prefs = await SharedPreferences.getInstance();
              final favs = prefs.getStringList('polar_favs') ?? [];
              _favUrls = favs.toSet();

              try {
                final channels = await PlaylistStorage().loadChannels(widget.playlist);
                // Ordenar canales alfabéticamente para una vista ordenada y ejecutiva
                channels.sort((a, b) => a.name.toLowerCase().compareTo(b.name.toLowerCase()));
                _all = channels;
                _applyFilter();
              } catch (_) {}

              if (mounted) setState(() => _loading = false);
            }

            Future<void> _toggleFav(Channel c) async {
              setState(() {
                if (_favUrls.contains(c.url)) {
                  _favUrls.remove(c.url);
                } else {
                  _favUrls.add(c.url);
                }
              });
              final prefs = await SharedPreferences.getInstance();
              await prefs.setStringList('polar_favs', _favUrls.toList());
              _applyFilter();
            }

            void _applyFilter() {
              setState(() {
                _filtered = _all.where((c) {
                  final matchesQuery = c.name.toLowerCase().contains(_query.toLowerCase());
                  final matchesCat = _selectedCategory == 'Todos' || c.group == _selectedCategory;
                  final matchesFav = !_onlyFavs || _favUrls.contains(c.url);
                  return matchesQuery && matchesCat && matchesFav;
                }).toList();
              });
            }

            List<String> get _categories {
              final set = <String>{'Todos'};
              for (final c in _all) {
                if (c.group.isNotEmpty) set.add(c.group);
              }
              final list = set.toList();
              list.sort((a, b) => a == 'Todos' ? -1 : (b == 'Todos' ? 1 : a.compareTo(b)));
              return list;
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  leading: IconButton(
                    icon: const Icon(Icons.arrow_back_ios_new_rounded, color: Colors.white70, size: 20),
                    onPressed: () => Navigator.pop(context),
                  ),
                  title: Text(widget.playlist.name, style: const TextStyle(fontWeight: FontWeight.w800, fontSize: 18, color: Colors.white)),
                  actions: [
                    IconButton(
                      icon: Icon(_showSearch ? Icons.close : Icons.search_rounded, color: Colors.white70),
                      onPressed: () => setState(() => _showSearch = !_showSearch),
                    ),
                    IconButton(
                      icon: Icon(
                        _onlyFavs ? Icons.star_rounded : Icons.star_outline_rounded,
                        color: _onlyFavs ? const Color(0xFF00F5D4) : Colors.white70,
                      ),
                      onPressed: () {
                        setState(() => _onlyFavs = !_onlyFavs);
                        _applyFilter();
                      },
                    ),
                    const SizedBox(width: 8),
                  ],
                ),
                body: _loading
                    ? const Center(child: CircularProgressIndicator(color: Color(0xFF00F5D4)))
                    : Column(
                        children: [
                          if (_showSearch)
                            Padding(
                              padding: const EdgeInsets.symmetric(horizontal: 24, vertical: 6),
                              child: TextField(
                                autofocus: true,
                                style: const TextStyle(color: Colors.white, fontSize: 14),
                                decoration: InputDecoration(
                                  hintText: 'Filtrar canal...',
                                  hintStyle: const TextStyle(color: Colors.white30),
                                  prefixIcon: const Icon(Icons.search, color: Color(0xFF00F5D4), size: 20),
                                  filled: true,
                                  fillColor: const Color(0xFF11171A),
                                  contentPadding: const EdgeInsets.symmetric(vertical: 0),
                                  border: OutlineInputBorder(borderRadius: BorderRadius.circular(10), borderSide: BorderSide.none),
                                ),
                                onChanged: (v) {
                                  _query = v;
                                  _applyFilter();
                                },
                              ),
                            ),
                          // Categorías ordenadas con estilo Menta
                          if (!_onlyFavs && _categories.length > 1)
                            Container(
                              height: 40,
                              margin: const EdgeInsets.symmetric(vertical: 6),
                              child: ListView.builder(
                                scrollDirection: Axis.horizontal,
                                padding: const EdgeInsets.symmetric(horizontal: 20),
                                itemCount: _categories.length,
                                itemBuilder: (ctx, i) {
                                  final cat = _categories[i];
                                  final isSel = cat == _selectedCategory;
                                  return Padding(
                                    padding: const EdgeInsets.only(right: 8),
                                    child: ChoiceChip(
                                      label: Text(cat, style: TextStyle(fontSize: 12, fontWeight: isSel ? FontWeight.bold : FontWeight.w500)),
                                      selected: isSel,
                                      selectedColor: const Color(0xFF00F5D4),
                                      backgroundColor: const Color(0xFF11171A),
                                      labelStyle: TextStyle(color: isSel ? const Color(0xFF0A0D0F) : Colors.white60),
                                      onSelected: (val) {
                                        if (val) {
                                          setState(() => _selectedCategory = cat);
                                          _applyFilter();
                                        }
                                      },
                                    ),
                                  );
                                },
                              ),
                            ),
                          // Cuadrícula Ejecutiva de 5 a 6 columnas en TV
                          Expanded(
                            child: _filtered.isEmpty
                                ? Center(
                                    child: Text(
                                      _onlyFavs ? 'Sin canales favoritos guardados' : 'No se encontraron canales',
                                      style: const TextStyle(color: Colors.white38, fontSize: 14),
                                    ),
                                  )
                                : LayoutBuilder(
                                    builder: (context, constraints) {
                                      final isTv = constraints.maxWidth > 900;
                                      final crossCount = isTv ? 6 : (constraints.maxWidth > 600 ? 4 : 3);

                                      return GridView.builder(
                                        padding: const EdgeInsets.symmetric(horizontal: 20, vertical: 8),
                                        gridDelegate: SliverGridDelegateWithFixedCrossAxisCount(
                                          crossAxisCount: crossCount,
                                          childAspectRatio: 1.25,
                                          crossAxisSpacing: 12,
                                          mainAxisSpacing: 12,
                                        ),
                                        itemCount: _filtered.length,
                                        itemBuilder: (ctx, i) {
                                          final c = _filtered[i];
                                          final isFav = _favUrls.contains(c.url);
                                          return _ExecutiveChannelTile(
                                            autofocus: i == 0,
                                            channel: c,
                                            isFav: isFav,
                                            onToggleFav: () => _toggleFav(c),
                                            onTap: () {
                                              Navigator.push(
                                                context,
                                                MaterialPageRoute(
                                                  builder: (_) => PlayerScreen(
                                                    channels: _filtered,
                                                    index: i,
                                                  ),
                                                ),
                                              );
                                            },
                                          );
                                        },
                                      );
                                    },
                                  ),
                          ),
                        ],
                      ),
              );
            }
          }

          class _ExecutiveChannelTile extends StatefulWidget {
            final Channel channel;
            final bool isFav;
            final VoidCallback onToggleFav;
            final VoidCallback onTap;
            final bool autofocus;

            const _ExecutiveChannelTile({
              required this.channel,
              required this.isFav,
              required this.onToggleFav,
              required this.onTap,
              this.autofocus = false,
            });

            @override
            State<_ExecutiveChannelTile> createState() => _ExecutiveChannelTileState();
          }

          class _ExecutiveChannelTileState extends State<_ExecutiveChannelTile> {
            bool _focused = false;

            @override
            Widget build(BuildContext context) {
              return Focus(
                autofocus: widget.autofocus,
                onFocusChange: (has) => setState(() => _focused = has),
                onKeyEvent: (node, event) {
                  if (event is KeyDownEvent) {
                    if (event.logicalKey == LogicalKeyboardKey.select ||
                        event.logicalKey == LogicalKeyboardKey.enter ||
                        event.logicalKey == LogicalKeyboardKey.numpadEnter ||
                        event.logicalKey == LogicalKeyboardKey.gameButtonA) {
                      widget.onTap();
                      return KeyEventResult.handled;
                    }
                  }
                  return KeyEventResult.ignored;
                },
                child: AnimatedContainer(
                  duration: const Duration(milliseconds: 120),
                  transform: _focused ? (Matrix4.identity()..scale(1.07)) : Matrix4.identity(),
                  decoration: BoxDecoration(
                    color: _focused ? const Color(0xFF17282A) : const Color(0xFF11171A),
                    borderRadius: BorderRadius.circular(12),
                    border: Border.all(
                      color: _focused
                          ? const Color(0xFF00F5D4)
                          : (widget.isFav ? const Color(0xFF00F5D4).withOpacity(0.5) : Colors.white.withOpacity(0.05)),
                      width: _focused ? 2.5 : 1.0,
                    ),
                    boxShadow: [
                      BoxShadow(
                        color: _focused ? const Color(0xFF00F5D4).withOpacity(0.4) : Colors.black.withOpacity(0.2),
                        blurRadius: _focused ? 16 : 4,
                        offset: const Offset(0, 2),
                      ),
                    ],
                  ),
                  child: InkWell(
                    borderRadius: BorderRadius.circular(12),
                    onTap: widget.onTap,
                    child: Stack(
                      children: [
                        Padding(
                          padding: const EdgeInsets.all(8),
                          child: Column(
                            crossAxisAlignment: CrossAxisAlignment.center,
                            children: [
                              Expanded(
                                child: Center(
                                  child: widget.channel.logo != null && widget.channel.logo!.isNotEmpty
                                      ? Image.network(
                                          widget.channel.logo!,
                                          fit: BoxFit.contain,
                                          errorBuilder: (_, __, ___) => const Icon(
                                            Icons.tv_rounded,
                                            size: 32,
                                            color: Color(0xFF00F5D4),
                                          ),
                                        )
                                      : const Icon(
                                          Icons.tv_rounded,
                                          size: 32,
                                          color: Color(0xFF00F5D4),
                                        ),
                                ),
                              ),
                              const SizedBox(height: 6),
                              Text(
                                widget.channel.name,
                                maxLines: 1,
                                overflow: TextOverflow.ellipsis,
                                textAlign: TextAlign.center,
                                style: TextStyle(
                                  fontSize: 12,
                                  fontWeight: FontWeight.w700,
                                  color: _focused ? const Color(0xFF00F5D4) : Colors.white.withOpacity(0.9),
                                ),
                              ),
                              if (widget.channel.group.isNotEmpty)
                                Text(
                                  widget.channel.group,
                                  maxLines: 1,
                                  overflow: TextOverflow.ellipsis,
                                  textAlign: TextAlign.center,
                                  style: TextStyle(
                                    fontSize: 10,
                                    color: Colors.white.withOpacity(0.35),
                                  ),
                                ),
                            ],
                          ),
                        ),
                        if (widget.isFav)
                          const Positioned(
                            top: 4,
                            right: 4,
                            child: Icon(Icons.star_rounded, color: Color(0xFF00F5D4), size: 14),
                          ),
                      ],
                    ),
                  ),
                ),
              );
            }
          }
          EOF

          # 7. PlayerScreen: Fix retroceso doble (PopScope único) y tema menta
          cat << 'EOF' > lib/screens/player_screen.dart
          import 'dart:async';
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:video_player/video_player.dart';
          import '../models/channel.dart';

          class PlayerScreen extends StatefulWidget {
            final List<Channel> channels;
            final int index;

            const PlayerScreen({super.key, required this.channels, required this.index});

            @override
            State<PlayerScreen> createState() => _PlayerScreenState();
          }

          class _PlayerScreenState extends State<PlayerScreen> {
            late int _currentIndex;
            VideoPlayerController? _controller;
            bool _showControls = true;
            bool _isLoading = true;
            bool _hasError = false;
            Timer? _hideTimer;
            final FocusNode _focusNode = FocusNode();

            @override
            void initState() {
              super.initState();
              _currentIndex = widget.index;
              _playChannel();
              WidgetsBinding.instance.addPostFrameCallback((_) {
                _focusNode.requestFocus();
              });
            }

            Future<void> _playChannel() async {
              setState(() {
                _isLoading = true;
                _hasError = false;
              });

              await _controller?.dispose();
              _controller = null;

              final channel = widget.channels[_currentIndex];
              final uri = Uri.parse(channel.url);

              _controller = VideoPlayerController.networkUrl(uri);

              try {
                await _controller!.initialize();
                await _controller!.play();
                setState(() => _isLoading = false);
                _resetTimer();
              } catch (_) {
                if (mounted) {
                  setState(() {
                    _isLoading = false;
                    _hasError = true;
                  });
                }
              }
            }

            void _toggleControls() {
              setState(() {
                _showControls = !_showControls;
              });
              if (_showControls) {
                _resetTimer();
              }
            }

            void _resetTimer() {
              _hideTimer?.cancel();
              _hideTimer = Timer(const Duration(seconds: 4), () {
                if (mounted) setState(() => _showControls = false);
              });
            }

            void _nextChannel() {
              if (_currentIndex < widget.channels.length - 1) {
                _currentIndex++;
                _playChannel();
              }
            }

            void _prevChannel() {
              if (_currentIndex > 0) {
                _currentIndex--;
                _playChannel();
              }
            }

            void _onBackPressed() {
              Navigator.of(context).pop();
            }

            KeyEventResult _handleKeyEvent(FocusNode node, KeyEvent event) {
              if (event is KeyDownEvent) {
                if (event.logicalKey == LogicalKeyboardKey.arrowRight ||
                    event.logicalKey == LogicalKeyboardKey.channelUp) {
                  _nextChannel();
                  _showTempControls();
                  return KeyEventResult.handled;
                } else if (event.logicalKey == LogicalKeyboardKey.arrowLeft ||
                           event.logicalKey == LogicalKeyboardKey.channelDown) {
                  _prevChannel();
                  _showTempControls();
                  return KeyEventResult.handled;
                } else if (event.logicalKey == LogicalKeyboardKey.select ||
                           event.logicalKey == LogicalKeyboardKey.enter ||
                           event.logicalKey == LogicalKeyboardKey.numpadEnter ||
                           event.logicalKey == LogicalKeyboardKey.gameButtonA) {
                  _toggleControls();
                  return KeyEventResult.handled;
                } else if (event.logicalKey == LogicalKeyboardKey.escape ||
                           event.logicalKey == LogicalKeyboardKey.goBack) {
                  _onBackPressed();
                  return KeyEventResult.handled;
                }
              }
              return KeyEventResult.ignored;
            }

            void _showTempControls() {
              setState(() => _showControls = true);
              _resetTimer();
            }

            @override
            void dispose() {
              _hideTimer?.cancel();
              _controller?.dispose();
              _focusNode.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              final channel = widget.channels[_currentIndex];

              // PopScope con canPop: false evita el retroceso doble automático del sistema
              return PopScope(
                canPop: false,
                onPopInvokedWithResult: (didPop, result) {
                  if (!didPop) {
                    _onBackPressed();
                  }
                },
                child: Scaffold(
                  backgroundColor: Colors.black,
                  body: Focus(
                    focusNode: _focusNode,
                    onKeyEvent: _handleKeyEvent,
                    autofocus: true,
                    child: GestureDetector(
                      onTap: _toggleControls,
                      behavior: HitTestBehavior.opaque,
                      child: Stack(
                        children: [
                          Center(
                            child: _controller != null && _controller!.value.isInitialized
                                ? AspectRatio(
                                    aspectRatio: _controller!.value.aspectRatio,
                                    child: VideoPlayer(_controller!),
                                  )
                                : _isLoading
                                    ? const CircularProgressIndicator(color: Color(0xFF00F5D4))
                                    : _hasError
                                        ? const Column(
                                            mainAxisSize: MainAxisSize.min,
                                            children: [
                                              Icon(Icons.error_outline_rounded, color: Colors.redAccent, size: 50),
                                              SizedBox(height: 12),
                                              Text(
                                                'Señal no disponible en este momento',
                                                style: TextStyle(color: Colors.white70, fontSize: 15),
                                              ),
                                            ],
                                          )
                                        : const SizedBox.shrink(),
                          ),
                          AnimatedOpacity(
                            opacity: _showControls ? 1.0 : 0.0,
                            duration: const Duration(milliseconds: 200),
                            child: IgnorePointer(
                              ignoring: !_showControls,
                              child: Container(
                                decoration: const BoxDecoration(
                                  gradient: LinearGradient(
                                    colors: [Colors.black87, Colors.transparent, Colors.black87],
                                    begin: Alignment.topCenter,
                                    end: Alignment.bottomCenter,
                                  ),
                                ),
                                child: SafeArea(
                                  child: Column(
                                    mainAxisAlignment: MainAxisAlignment.spaceBetween,
                                    children: [
                                      Padding(
                                        padding: const EdgeInsets.symmetric(horizontal: 24, vertical: 16),
                                        child: Row(
                                          children: [
                                            IconButton(
                                              icon: const Icon(Icons.arrow_back_ios_new_rounded, color: Colors.white, size: 24),
                                              onPressed: _onBackPressed,
                                            ),
                                            const SizedBox(width: 12),
                                            Expanded(
                                              child: Column(
                                                crossAxisAlignment: CrossAxisAlignment.start,
                                                children: [
                                                  Text(
                                                    channel.name,
                                                    style: const TextStyle(
                                                      color: Colors.white,
                                                      fontSize: 20,
                                                      fontWeight: FontWeight.bold,
                                                    ),
                                                    maxLines: 1,
                                                    overflow: TextOverflow.ellipsis,
                                                  ),
                                                  if (channel.group.isNotEmpty)
                                                    Text(
                                                      channel.group,
                                                      style: const TextStyle(color: Color(0xFF00F5D4), fontSize: 13),
                                                    ),
                                                ],
                                              ),
                                            ),
                                          ],
                                        ),
                                      ),
                                      Padding(
                                        padding: const EdgeInsets.symmetric(horizontal: 32),
                                        child: Row(
                                          mainAxisAlignment: MainAxisAlignment.spaceBetween,
                                          children: [
                                            IconButton(
                                              icon: const Icon(Icons.skip_previous_rounded, color: Colors.white70, size: 46),
                                              onPressed: _currentIndex > 0 ? _prevChannel : null,
                                            ),
                                            IconButton(
                                              icon: const Icon(Icons.skip_next_rounded, color: Colors.white70, size: 46),
                                              onPressed: _currentIndex < widget.channels.length - 1 ? _nextChannel : null,
                                            ),
                                          ],
                                        ),
                                      ),
                                      Padding(
                                        padding: const EdgeInsets.all(18),
                                        child: Row(
                                          mainAxisAlignment: MainAxisAlignment.center,
                                          children: [
                                            Container(
                                              padding: const EdgeInsets.symmetric(horizontal: 14, vertical: 6),
                                              decoration: BoxDecoration(
                                                color: const Color(0xFF11171A),
                                                borderRadius: BorderRadius.circular(20),
                                                border: Border.all(color: Colors.white.withOpacity(0.08)),
                                              ),
                                              child: const Row(
                                                children: [
                                                  Icon(Icons.circle, color: Color(0xFF00F5D4), size: 10),
                                                  SizedBox(width: 8),
                                                  Text(
                                                    'EN VIVO • Flechas ◄ ► cambian canal • Atrás regresa a canales',
                                                    style: TextStyle(color: Colors.white70, fontSize: 12, fontWeight: FontWeight.bold),
                                                  ),
                                                ],
                                              ),
                                            ),
                                          ],
                                        ),
                                      ),
                                    ],
                                  ),
                                ),
                              ),
                            ),
                          ),
                        ],
                      ),
                    ),
                  ),
                ),
              );
            }
          }
          EOF

