            <circle cx="317" cy="245" r="13" fill="#0B132B"/>
            <circle cx="321" cy="241" r="4.5" fill="#FFFFFF"/>
            <ellipse cx="256" cy="325" rx="72" ry="58" fill="#F8FEFF"/>
            <path d="M 230 300 Q 256 290 282 300 Q 256 332 230 300 Z" fill="#0B132B"/>
            <line x1="256" y1="316" x2="256" y2="340" stroke="#0B132B" stroke-width="6" stroke-linecap="round"/>
            <path d="M 236 340 Q 256 352 276 340" stroke="#0B132B" stroke-width="6" fill="none" stroke-linecap="round"/>
            <text x="256" y="468" font-family="sans-serif" font-weight="900" font-size="38" fill="#00E5FF" text-anchor="middle" letter-spacing="4">POLAR TV</text>
          </svg>
          EOF

          # Banner oficial panorámico Android TV (320x180 px)
          cat << 'EOF' > /tmp/tv_banner.svg
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180">
            <defs>
              <linearGradient id="tvbg" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#0B132B"/>
                <stop offset="100%" stop-color="#1C2541"/>
              </linearGradient>
            </defs>
            <rect width="320" height="180" fill="url(#tvbg)"/>
            <!-- Cabeza Oso Polar reducida lateral -->
            <ellipse cx="80" cy="90" rx="45" ry="40" fill="#FFFFFF"/>
            <circle cx="50" cy="55" r="14" fill="#E2F6F9"/>
            <circle cx="110" cy="55" r="14" fill="#E2F6F9"/>
            <circle cx="65" cy="80" r="4" fill="#0B132B"/>
            <circle cx="95" cy="80" r="4" fill="#0B132B"/>
            <ellipse cx="80" cy="100" rx="18" ry="14" fill="#F8FEFF"/>
            <path d="M 74 96 Q 80 92 86 96 Q 80 104 74 96 Z" fill="#0B132B"/>
            <!-- Texto Polar TV -->
            <text x="145" y="92" font-family="sans-serif" font-weight="900" font-size="28" fill="#FFFFFF">POLAR</text>
            <text x="245" y="92" font-family="sans-serif" font-weight="900" font-size="28" fill="#00E5FF">TV</text>
            <text x="145" y="116" font-family="sans-serif" font-weight="bold" font-size="11" fill="#48CAE4" letter-spacing="2">SMART IPTV</text>
          </svg>
          EOF

          RES="android/app/src/main/res"
          mkdir -p $RES/drawable
          convert -background none /tmp/polar_bear.svg -resize 48x48   $RES/mipmap-mdpi/ic_launcher.png
          convert -background none /tmp/polar_bear.svg -resize 72x72   $RES/mipmap-hdpi/ic_launcher.png
          convert -background none /tmp/polar_bear.svg -resize 96x96   $RES/mipmap-xhdpi/ic_launcher.png
          convert -background none /tmp/polar_bear.svg -resize 144x144 $RES/mipmap-xxhdpi/ic_launcher.png
          convert -background none /tmp/polar_bear.svg -resize 192x192 $RES/mipmap-xxxhdpi/ic_launcher.png
          convert -background none /tmp/tv_banner.svg -resize 320x180 $RES/drawable/tv_banner.png

          # 9. Configuración de firma y compileSdk 36
          cat << 'EOF' >> android/app/build.gradle.kts

          android {
              signingConfigs {
                  getByName("debug") {
                      storeFile = file("/home/runner/.android/debug.keystore")
                  }
              }
              buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }
          }
          EOF

          cat << 'EOF' >> android/build.gradle

          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          compileSdkVersion 36
                      }
                  }
              }
          }
          EOF

          flutter pub get

      - name: Compilar APK con Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Preparar archivo para descarga
        run: |
          mkdir -p output_apk
          find . -name "*.apk" -exec cp {} output_apk/PolarTV.apk \;
          ls -lh output_apk/

      - name: Subir APK de Polar TV
        uses: actions/upload-artifact@v4
        with:
          name: Polar-TV-APK
          path: output_apk/PolarTV.apk
          if-no-files-found: error
