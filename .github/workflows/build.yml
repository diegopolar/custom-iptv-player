name: Build Polar TV APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Instalar ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Configurar Polar TV, PiP, Listas y Logo de Oso Polar
        run: |
          # 1. Generar base Android
          flutter create --platforms=android --project-name polartv --org com.polar .

          # 2. Configurar AndroidManifest con soporte PiP y streaming
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>

              <application
                  android:label="Polar TV"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:taskAffinity=""
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:supportsPictureInPicture="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme"
                        />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF

          # 3. Soporte PiP nativo al minimizar la app
          mkdir -p android/app/src/main/kotlin/com/polar/polartv
          cat << 'EOF' > android/app/src/main/kotlin/com/polar/polartv/MainActivity.kt
          package com.polar.polartv

          import android.app.PictureInPictureParams
          import android.os.Build
          import android.util.Rational
          import io.flutter.embedding.android.FlutterActivity

          class MainActivity: FlutterActivity() {
              override fun onUserLeaveHint() {
                  super.onUserLeaveHint()
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      try {
                          val params = PictureInPictureParams.Builder()
                              .setAspectRatio(Rational(16, 9))
                              .build()
                          enterPictureInPictureMode(params)
                      } catch (e: Exception) {
                          enterPictureInPictureMode()
                      }
                  }
              }
          }
          EOF

          # 4. Ajustar orientación vertical en player_screen.dart
          if [ -f lib/screens/player_screen.dart ]; then
            sed -i 's/DeviceOrientation.landscapeLeft,/DeviceOrientation.portraitUp, DeviceOrientation.landscapeLeft,/g' lib/screens/player_screen.dart
          fi

          # 5. Inyectar listas por defecto en playlist_storage.dart usando el constructor exacto
          python3 -c '
          import os

          storage_path = "lib/services/playlist_storage.dart"
          if os.path.exists(storage_path):
              with open(storage_path, "r") as f:
                  code = f.read()
              
              # Detectar la llamada donde devuelve la lista guardada e inyectar si está vacía
              hook = "return list;"
              replacement = """if (list.isEmpty) {
                    final defaultList = [
                      Playlist(id: "pe", name: "Canales Perú 🇵🇪", source: "https://iptv-org.github.io/iptv/countries/pe.m3u"),
                      Playlist(id: "global", name: "Canales Globales 🌐", source: "https://iptv-org.github.io/iptv/index.m3u"),
                    ];
                    for (final p in defaultList) {
                      await add(p);
                    }
                    return defaultList;
                  }
                  return list;"""
              
              if hook in code and "Canales Perú" not in code:
                  code = code.replace(hook, replacement, 1)
              
              with open(storage_path, "w") as f:
                  f.write(code)
          '

          # 6. Crear logo vectorial del Oso Polar
          cat << 'EOF' > /tmp/polar_bear.svg
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
            <defs>
              <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#0B132B"/>
                <stop offset="100%" stop-color="#1C2541"/>
              </linearGradient>
              <linearGradient id="ice" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#FFFFFF"/>
                <stop offset="100%" stop-color="#D0EDF2"/>
              </linearGradient>
            </defs>
            <rect width="512" height="512" rx="120" fill="url(#bg)"/>
            <circle cx="150" cy="155" r="46" fill="#E2F6F9"/>
            <circle cx="150" cy="155" r="26" fill="#A8D5DE"/>
            <circle cx="362" cy="155" r="46" fill="#E2F6F9"/>
            <circle cx="362" cy="155" r="26" fill="#A8D5DE"/>
            <ellipse cx="256" cy="285" rx="160" ry="140" fill="url(#ice)"/>
            <circle cx="195" cy="245" r="13" fill="#0B132B"/>
            <circle cx="199" cy="241" r="4.5" fill="#FFFFFF"/>
            <circle cx="317" cy="245" r="13" fill="#0B132B"/>
            <circle cx="321" cy="241" r="4.5" fill="#FFFFFF"/>
            <ellipse cx="256" cy="325" rx="72" ry="58" fill="#F8FEFF"/>
            <path d="M 230 300 Q 256 290 282 300 Q 256 332 230 300 Z" fill="#0B132B"/>
            <line x1="256" y1="316" x2="256" y2="340" stroke="#0B132B" stroke-width="6" stroke-linecap="round"/>
            <path d="M 236 340 Q 256 352 276 340" stroke="#0B132B" stroke-width="6" fill="none" stroke-linecap="round"/>
            <text x="256" y="468" font-family="sans-serif" font-weight="900" font-size="38" fill="#00E5FF" text-anchor="middle" letter-spacing="4">POLAR TV</text>
          </svg>
          EOF

          RES="android/app/src/main/res"
          convert -background none /tmp/polar_bear.svg -resize 48x48   $RES/mipmap-mdpi/ic_launcher.png
          convert -background none /tmp/polar_bear.svg -resize 72x72   $RES/mipmap-hdpi/ic_launcher.png
          convert -background none /tmp/polar_bear.svg -resize 96x96   $RES/mipmap-xhdpi/ic_launcher.png
          convert -background none /tmp/polar_bear.svg -resize 144x144 $RES/mipmap-xxhdpi/ic_launcher.png
          convert -background none /tmp/polar_bear.svg -resize 192x192 $RES/mipmap-xxxhdpi/ic_launcher.png

          # 7. Forzar compileSdk 36 en plugins
          cat << 'EOF' >> android/build.gradle

          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          compileSdkVersion 36
                      }
                  }
              }
          }
          EOF

          flutter pub get

      - name: Compilar APK Release
        run: flutter build apk --release

      - name: Subir APK de Polar TV
        uses: actions/upload-artifact@v4
        with:
          name: Polar-TV-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
