name: Build Custom IPTV APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Regenerar estructura Android y ajustar compileSdk
        run: |
          # 1. Respaldar Manifest configurado por Claude
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml.bak
          
          # 2. Generar estructura Gradle nativa
          flutter create --platforms=android --org com.example .
          
          # 3. Restaurar Manifest
          cp /tmp/AndroidManifest.xml.bak android/app/src/main/AndroidManifest.xml
          
          # 4. Forzar compileSdk 36 en el proyecto y en todos los subproyectos (plugins como file_picker)
          cat << 'EOF' >> android/build.gradle

          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          compileSdkVersion 36
                      }
                  }
              }
          }
          EOF

          # 5. Obtener paquetes
          flutter pub get

      - name: Compilar APK Release
        run: flutter build apk --release

      - name: Subir APK generado
        uses: actions/upload-artifact@v4
        with:
          name: custom-iptv-player-apk
          path: build/app/outputs/flutter-apk/app-release.apk
