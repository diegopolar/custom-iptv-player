          RES="android/app/src/main/res"
          mkdir -p $RES/drawable
          convert -background none /tmp/polar_bear.svg -resize 48x48   $RES/mipmap-mdpi/ic_launcher.png
          convert -background none /tmp/polar_bear.svg -resize 72x72   $RES/mipmap-hdpi/ic_launcher.png
          convert -background none /tmp/polar_bear.svg -resize 96x96   $RES/mipmap-xhdpi/ic_launcher.png
          convert -background none /tmp/polar_bear.svg -resize 144x144 $RES/mipmap-xxhdpi/ic_launcher.png
          convert -background none /tmp/polar_bear.svg -resize 192x192 $RES/mipmap-xxxhdpi/ic_launcher.png
          convert -background none /tmp/tv_banner.svg -resize 320x180 $RES/drawable/tv_banner.png

          # 9. Configuración de firma y compileSdk 36
          cat << 'EOF' >> android/app/build.gradle.kts

          android {
              signingConfigs {
                  getByName("debug") {
                      storeFile = file("/home/runner/.android/debug.keystore")
                  }
              }
              buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }
          }
          EOF

          cat << 'EOF' >> android/build.gradle

          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          compileSdkVersion 36
                      }
                  }
              }
          }
          EOF

          flutter pub get

      - name: Compilar APK con Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Preparar archivo para descarga
        run: |
          mkdir -p output_apk
          find . -name "*.apk" -exec cp {} output_apk/PolarTV.apk \;
          ls -lh output_apk/

      - name: Subir APK de Polar TV
        uses: actions/upload-artifact@v4
        with:
          name: Polar-TV-APK
          path: output_apk/PolarTV.apk
          if-no-files-found: error
