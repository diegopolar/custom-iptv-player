name: Build Polar TV APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Instalar ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Configurar Polar TV, PiP, Listas y Logo de Oso Polar
        run: |
          # 1. Generar estructura Android base con nombre Polar TV
          flutter create --platforms=android --project-name polartv --org com.polar .

          # 2. Configurar AndroidManifest.xml limpio con soporte PiP y streaming
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>

              <application
                  android:label="Polar TV"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:taskAffinity=""
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:supportsPictureInPicture="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme"
                        />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF

          # 3. Soporte PiP nativo en MainActivity.kt al salir de la app
          mkdir -p android/app/src/main/kotlin/com/polar/polartv
          cat << 'EOF' > android/app/src/main/kotlin/com/polar/polartv/MainActivity.kt
          package com.polar.polartv

          import android.app.PictureInPictureParams
          import android.os.Build
          import android.util.Rational
          import io.flutter.embedding.android.FlutterActivity

          class MainActivity: FlutterActivity() {
              override fun onUserLeaveHint() {
                  super.onUserLeaveHint()
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      try {
                          val params = PictureInPictureParams.Builder()
                              .setAspectRatio(Rational(16, 9))
                              .build()
                          enterPictureInPictureMode(params)
                      } catch (e: Exception) {
                          enterPictureInPictureMode()
                      }
                  }
              }
          }
          EOF

          # 4. Ajustar título en main.dart
          if [ -f lib/main.dart ]; then
            sed -i "s/title: '[^']*'/title: 'Polar TV'/g" lib/main.dart
            sed -i 's/title: "[^"]*"/title: "Polar TV"/g' lib/main.dart
          fi

          # 5. Ajustar player_screen.dart: orientacion vertical y Wakelock sin romper sintaxis
          python3 -c '
          import os

          player_path = "lib/screens/player_screen.dart"
          if os.path.exists(player_path):
              with open(player_path, "r") as f:
                  code = f.read()
              
              if "import \"package:wakelock_plus/wakelock_plus.dart\";" not in code and "import \x27package:wakelock_plus/wakelock_plus.dart\x27;" not in code:
                  code = "import \x27package:wakelock_plus/wakelock_plus.dart\x27;\n" + code
              
              code = code.replace("DeviceOrientation.landscapeLeft,", "DeviceOrientation.portraitUp, DeviceOrientation.landscapeLeft,")
              code = code.replace("super.initState();", "super.initState();\n    WakelockPlus.enable();")
              
              with open(player_path, "w") as f:
                  f.write(code)
          '

          # 6. Precargar canales Perú y Global en home_screen.dart de forma limpia
          python3 -c '
          import os

          home_path = "lib/screens/home_screen.dart"
          if os.path.exists(home_path):
              with open(home_path, "r") as f:
                  code = f.read()
              
              # Inyectar precarga en el metodo que carga las listas si esta vacio
              hook = "final l = await _store.getAll();"
              injection = """final l = await _store.getAll();
                  if (l.isEmpty) {
                    try {
                      await _store.add(Playlist(name: "Canales Perú 🇵🇪", source: "https://iptv-org.github.io/iptv/countries/pe.m3u"));
                      await _store.add(Playlist(name: "Canales Globales 🌐", source: "https://iptv-org.github.io/iptv/index.m3u"));
                      final updated = await _store.getAll();
                      if (mounted) setState(() => _playlists = updated);
                    } catch (_) {}
                  }"""
              if hook in code:
                  code = code.replace(hook, injection, 1)
              
              with open(home_path, "w") as f:
                  f.write(code)
          '

          # 7. Crear logo vectorial del Oso Polar (Polar TV)
          cat << 'EOF' > /tmp/polar_bear.svg
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
            <defs>
              <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#0B132B"/>
                <stop offset="100%" stop-color="#1C2541"/>
              </linearGradient>
              <linearGradient id="ice" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#FFFFFF"/>
                <stop offset="100%" stop-color="#D0EDF2"/>
              </linearGradient>
            </defs>
            <rect width="512" height="512" rx="120" fill="url(#bg)"/>
            
            <!-- Orejas del Oso Polar -->
            <circle cx="150" cy="155" r="46" fill="#E2F6F9"/>
            <circle cx="150" cy="155" r="26" fill="#A8D5DE"/>
            <circle cx="362" cy="155" r="46" fill="#E2F6F9"/>
            <circle cx="362" cy="155" r="26" fill="#A8D5DE"/>
            
            <!-- Cabeza -->
            <ellipse cx="256" cy="285" rx="160" ry="140" fill="url(#ice)"/>
            
            <!-- Ojos -->
            <circle cx="195" cy="245" r="13" fill="#0B132B"/>
            <circle cx="199" cy="241" r="4.5" fill="#FFFFFF"/>
            <circle cx="317" cy="245" r="13" fill="#0B132B"/>
            <circle cx="321" cy="241" r="4.5" fill="#FFFFFF"/>
            
            <!-- Hocico y Nariz -->
            <ellipse cx="256" cy="325" rx="72" ry="58" fill="#F8FEFF"/>
            <path d="M 230 300 Q 256 290 282 300 Q 256 332 230 300 Z" fill="#0B132B"/>
            <line x
